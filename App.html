    if (!wrap) return;
    wrap.scrollLeft = mapView.sl;
    wrap.scrollTop = mapView.st;
  }

  // 倍率を変える（地図の幅＝表示枠の幅×倍率）
  function applyMapZoom(z) {
    var wrap = document.getElementById('map-wrap');
    var inner = document.getElementById('map-inner');
    if (!wrap || !inner) return;
    mapView.zoom = Math.max(1, Math.min(MAP_MAX_ZOOM, z));
    inner.style.width = Math.round(wrap.clientWidth * mapView.zoom) + 'px';
    var lb = document.getElementById('map-zoom-label');
    if (lb) lb.textContent = Math.round(mapView.zoom * 100) + '%';
    scheduleDraw();
  }

  // 指の位置（clientX/Y）を中心に拡大・縮小する
  function zoomAt(z, cx, cy) {
    var wrap = document.getElementById('map-wrap');
    if (!wrap) return;
    var r = wrap.getBoundingClientRect();
    var ax = cx - r.left, ay = cy - r.top;
    var old = mapView.zoom;
    var nz = Math.max(1, Math.min(MAP_MAX_ZOOM, z));
    var contentX = (wrap.scrollLeft + ax) / old;
    var contentY = (wrap.scrollTop + ay) / old;
    applyMapZoom(nz);
    wrap.scrollLeft = contentX * nz - ax;
    wrap.scrollTop = contentY * nz - ay;
    mapView.sl = wrap.scrollLeft;
    mapView.st = wrap.scrollTop;
  }

  var drawPending = false;
  function scheduleDraw() {
    if (drawPending) return;
    drawPending = true;
    requestAnimationFrame(function () { drawPending = false; drawInk(); });
  }

  function drawInk() {
    var img = document.getElementById('map-img');
    var cv = document.getElementById('map-ink');
    if (!img || !cv || !img.naturalWidth) return;
    var w = img.clientWidth, h = img.clientHeight;
    // 大きく拡大したとき、スマホで描けない大きさにならないよう解像度を抑える
    var dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(12000000 / Math.max(1, w * h)));
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ink.items.concat(ink.current ? [ink.current] : []).forEach(function (it) { drawItem(ctx, it, w, h); });
  }

  function drawItem(ctx, it, w, h) {
    ctx.strokeStyle = INK_COLORS[it.c] || INK_COLORS.k;
    if (it.t === 'p') {
      ctx.lineWidth = Math.max(2, w * 0.004);
      ctx.beginPath();
      for (var i = 0; i < it.p.length; i += 2) {
        var x = it.p[i] / 1000 * w, y = it.p[i + 1] / 1000 * h;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      if (it.p.length === 2) ctx.lineTo(it.p[0] / 1000 * w + 0.1, it.p[1] / 1000 * h);
      ctx.stroke();
    } else {
      var cx = it.x / 1000 * w, cy = it.y / 1000 * h, r = Math.max(8, w * 0.022);
      ctx.lineWidth = Math.max(2.5, w * 0.005);
      ctx.beginPath();
      if (it.t === 'o') {
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
      } else {
        ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r);
        ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r);
      }
      ctx.stroke();
    }
  }

  // 画面上の位置を、地図上の位置（0〜1000）に変換
  function mapPoint(clientX, clientY) {
    var cv = document.getElementById('map-ink');
    var r = cv.getBoundingClientRect();
    return [Math.round(Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * 1000), Math.round(Math.min(1, Math.max(0, (clientY - r.top) / r.height)) * 1000)];
  }

  // ----- 指の操作：1本指＝書き込み（移動モードでは移動）、2本指＝拡大・縮小と移動 -----
  var gesture = { pts: {}, mode: null };

  function canDrawNow() {
    var c = state.terrCard;
    return ink.tool !== 'move' && c && c.canInk && !c.loading;
  }

  function mapDown(e) {
    var wrap = e.currentTarget;
    gesture.pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    var ids = Object.keys(gesture.pts);
    if (ids.length === 1) {
      if (canDrawNow()) {
        e.preventDefault();
        gesture.mode = 'draw';
        drawStart(e.clientX, e.clientY);
      } else {
        gesture.mode = 'pan';
        gesture.last = { x: e.clientX, y: e.clientY };
      }
    } else if (ids.length === 2) {
      // 2本目の指が触れたら、書きかけの線は取り消して拡大・移動に切り替える
      cancelDraw();
      var a = gesture.pts[ids[0]], b = gesture.pts[ids[1]];
      gesture.mode = 'pinch';
      gesture.d0 = Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
      gesture.z0 = mapView.zoom;
      gesture.mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }
  }

  function mapMove(e) {
    if (!gesture.pts[e.pointerId]) return;
    gesture.pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var wrap = document.getElementById('map-wrap');
    if (!wrap) return;
    if (gesture.mode === 'draw') {
      e.preventDefault();
      drawMove(e.clientX, e.clientY);
    } else if (gesture.mode === 'pan') {
      e.preventDefault();
      var dx = e.clientX - gesture.last.x, dy = e.clientY - gesture.last.y;
      gesture.last = { x: e.clientX, y: e.clientY };
      panBy(wrap, dx, dy);
    } else if (gesture.mode === 'pinch') {
      e.preventDefault();
      var ids = Object.keys(gesture.pts);
      if (ids.length < 2) return;
      var a = gesture.pts[ids[0]], b = gesture.pts[ids[1]];
      var mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      var d = Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
      zoomAt(gesture.z0 * d / gesture.d0, mid.x, mid.y);
      panBy(wrap, mid.x - gesture.mid.x, mid.y - gesture.mid.y);
      gesture.mid = mid;
    }
  }

  // 地図を動かす。地図の端まで来たら、残りはページ全体をスクロール
  function panBy(wrap, dx, dy) {
    var bl = wrap.scrollLeft, bt = wrap.scrollTop;
    wrap.scrollLeft = bl - dx;
    wrap.scrollTop = bt - dy;
    var restY = -dy - (wrap.scrollTop - bt);
    if (Math.abs(restY) > 0.5 && !mapView.full) window.scrollBy(0, restY);
    mapView.sl = wrap.scrollLeft;
    mapView.st = wrap.scrollTop;
  }

  function mapUp(e) {
    if (!gesture.pts[e.pointerId]) return;
    delete gesture.pts[e.pointerId];
    var left = Object.keys(gesture.pts).length;
    if (gesture.mode === 'draw' && left === 0) drawEnd();
    if (gesture.mode === 'pinch' && left === 1) {
      // 1本指が残ったら、そのまま移動を続ける（書き込みはしない）
      var id = Object.keys(gesture.pts)[0];
      gesture.mode = 'pan';
      gesture.last = { x: gesture.pts[id].x, y: gesture.pts[id].y };
    }
    if (left === 0) gesture.mode = null;
  }

  function drawStart(cx, cy) {
    var p = mapPoint(cx, cy);
    var me = state.user.id;
    if (ink.tool === 'erase') {
      ink.erasing = { count: 0, blocked: false };
      eraseAt(p);
      return;
    }
    if (ink.tool === 'pen') {
      ink.current = { t: 'p', c: ink.color, a: me, p: [p[0], p[1]] };
      scheduleDraw();
      return;
    }
    // ○・✕は、指を離したときに置く（2本指の操作と区別するため）
    ink.pendingStamp = { t: ink.tool, c: ink.color, a: me, x: p[0], y: p[1] };
  }

  function drawMove(cx, cy) {
    var p = mapPoint(cx, cy);
    if (ink.erasing) { eraseAt(p); return; }
    if (ink.pendingStamp) {
      ink.pendingStamp.x = p[0];
      ink.pendingStamp.y = p[1];
      return;
    }
    if (!ink.current) return;
    var a = ink.current.p;
    var dx = p[0] - a[a.length - 2], dy = p[1] - a[a.length - 1];
    if (dx * dx + dy * dy < 16) return;   // 細かすぎる点は省いてデータを軽くする
    a.push(p[0], p[1]);
    scheduleDraw();
  }

  function drawEnd() {
    if (ink.erasing) {
      var er = ink.erasing;
      ink.erasing = null;
      if (er.count) inkChanged();
      else if (er.blocked) toast('ほかの人が書いたものは消せません。', true);
      return;
    }
    if (ink.pendingStamp) {
      var st = ink.pendingStamp;
      ink.pendingStamp = null;
      ink.items.push(st);
      ink.history.push({ op: 'add', item: st });
      inkChanged();
      scheduleDraw();
      return;
    }
    if (!ink.current) return;
    ink.items.push(ink.current);
    ink.history.push({ op: 'add', item: ink.current });
    ink.current = null;
    inkChanged();
    scheduleDraw();
  }

  function cancelDraw() {
    ink.current = null;
    ink.pendingStamp = null;
    if (ink.erasing) {
      // 2本指になる前に消したものは、そのまま保存する
      var er = ink.erasing;
      ink.erasing = null;
      if (er.count) inkChanged();
    }
    scheduleDraw();
  }

  // 消しゴム：触れた書き込みを1つずつ丸ごと消す
  function canErase(it) {
    return !!(state.terrCard && (state.terrCard.isAdmin || it.a === state.user.id));
  }

  function hitTest(it, p, w, h, tol) {
    var px = p[0] / 1000 * w, py = p[1] / 1000 * h;
    if (it.t === 'p') {
      for (var i = 0; i < it.p.length; i += 2) {
        var x1 = it.p[i] / 1000 * w, y1 = it.p[i + 1] / 1000 * h;
        var x2 = i + 3 < it.p.length ? it.p[i + 2] / 1000 * w : x1;
        var y2 = i + 3 < it.p.length ? it.p[i + 3] / 1000 * h : y1;
        if (distToSeg(px, py, x1, y1, x2, y2) <= tol) return true;
      }
      return false;
    }
    var r = Math.max(8, w * 0.022);
    var dx = px - it.x / 1000 * w, dy = py - it.y / 1000 * h;
    return Math.sqrt(dx * dx + dy * dy) <= r + tol;
  }

  function distToSeg(px, py, x1, y1, x2, y2) {
    var dx = x2 - x1, dy = y2 - y1;
    var len = dx * dx + dy * dy;
    var t = len ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len)) : 0;
    var cx = x1 + t * dx - px, cy = y1 + t * dy - py;
    return Math.sqrt(cx * cx + cy * cy);
  }

  function eraseAt(p) {
    var cv = document.getElementById('map-ink');
    if (!cv) return;
    var w = cv.clientWidth, h = cv.clientHeight;
    // 消しゴムの大きさは、画面上でほぼ一定（拡大しても指の太さくらい）
    var tol = 14;
    for (var i = ink.items.length - 1; i >= 0; i--) {
      var it = ink.items[i];
      if (!hitTest(it, p, w, h, tol)) continue;
      if (!canErase(it)) { ink.erasing.blocked = true; continue; }
      ink.items.splice(i, 1);
      ink.history.push({ op: 'del', item: it, index: i });
      ink.erasing.count++;
    }
    scheduleDraw();
  }

  function setInkStatus(t) {
    ink.status = t;
    var el = document.getElementById('ink-status');
    if (el) el.textContent = t;
  }

  function inkChanged() {
    ink.dirty = true;
    setInkStatus('保存待ち…');
    clearTimeout(ink.saveTimer);
    ink.saveTimer = setTimeout(saveInk, 1200);
  }

  function saveInk() {
    var id = ink.cardId;
    if (!id) return;
    var data = ink.items.length ? JSON.stringify({ v: 1, items: ink.items }) : '';
    setInkStatus('保存中…');
    call('api_saveInk', state.token, id, data).then(function () {
      if (ink.cardId === id) {
        ink.dirty = false;
        ink.loadedFrom = data;
        if (state.terrCard && state.terrCard.id === id) state.terrCard.ink = data;
      }
      setInkStatus('保存しました');
    }, function (e) {
      setInkStatus('保存できませんでした');
      handleError(e);
      // サーバーの内容に戻す
      if (ink.cardId === id) {
        ink.dirty = false;
        ink.loadedFrom = null;
        if (state.screen === 'terrCard' && state.terrCard && state.terrCard.id === id) reloadTerrCard(id);
      }
    });
  }

  // ----- リスト型 -----
  // 文字の中のURLを見つける（リンクとして開けるように）
  function findUrl(text) {
    var m = String(text || '').match(/https?:\/\/[^\s"'<>]+/);
    return m ? m[0] : '';
  }

  // リストのシートを読み込む（シートの切り替え・更新）
  function loadListSheet(gid) {

    c.list.gid = gid;
    c.listLoading = true;
    render();
    return call('api_listSheet', state.token, c.id, gid).then(function (list) {
      if (state.terrCard !== c) return;
      c.list = list;
      c.listLoading = false;
      render();
      var w2 = document.querySelector('.sheet-tabs');
      if (w2) w2.scrollLeft = keepX;
    }, function (e) {
      c.listLoading = false;
      render();
      handleError(e);
    });
  }

      }).join('') + '</tr>';
    }).join('');
    return tabs +
      '<div class="muted small">セルをタップすると編集できます（元のスプレッドシートに保存されます）。リンクはタップで開きます。表は上下左右にスクロールできます</div>' +

  // ----- 区域カードの管理 -----
  function viewTerrAdmin() {
    var t = state.terr;
    if (!t) return '<div class="muted center">読み込み中…</div>';
    if (!t.isAdmin) return '<div class="empty">区域カード管理者だけが使える画面です</div>';
    var a = state.terrAdmin = state.terrAdmin || { selected: null, bulk: [] };
    var cards = t.cards.filter(notList);
    var lists = t.cards.filter(isList);
    if (!a.selected) {
      a.selected = {};
      cards.forEach(function (c) { if (c.available) a.selected[c.id] = true; });
    }
    var count = Object.keys(a.selected).filter(function (k) { return a.selected[k]; }).length;
    var chip = function (c) {

        (cards.length ? '<div class="avail-list">' + chips + '</div>' : '<div class="muted small">区域カードがまだ登録されていません</div>') +

  // 地図ファイルを登録用の画像に変換（画像は縮小、PDFは1ページ目を画像に）
  var MAP_MAX = 2400;
  function mapFileToJpeg(file) {
    var type = file.type || '';
    if (type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
      return Promise.all([readArrayBuffer(file), loadPdfJs()]).then(function (r) {
        return r[1].getDocument({ data: new Uint8Array(r[0]), cMapUrl: PDFJS_ASSETS_URL + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS_ASSETS_URL + 'standard_fonts/' }).promise;
      }).then(function (doc) {
        return doc.getPage(1).then(function (page) {
          var base = page.getViewport({ scale: 1 });
          var scale = MAP_MAX / Math.max(base.width, base.height);
          var vp = page.getViewport({ scale: scale });
          var c = document.createElement('canvas');
          c.width = Math.floor(vp.width);
          c.height = Math.floor(vp.height);
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, c.width, c.height);
          return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
            doc.destroy();
            return c.toDataURL('image/jpeg', 0.85).split(',')[1];
          });
        });
      });
    }
    if (type.indexOf('image/') === 0) {
      return readDataUrl(file).then(function (d) { return shrinkImage(d, MAP_MAX, 0.85); });
    }
    return Promise.reject(new Error('画像かPDFを選んでください。'));
  }

  function readArrayBuffer(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error('ファイルを読み込めませんでした。')); };
      r.readAsArrayBuffer(file);
    });
  }

  // ファイル名から区域番号を読み取る（例：「1-1.jpg」「区域3_2.pdf」「１２.png」）
  function labelFromFileName(name) {
    var base = String(name).replace(/\.[^.]+$/, '')
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    var m = base.match(/(\d{1,4})\s*[_‐－ー−―\-]\s*(\d{1,3})(?!\d)/) || base.match(/(\d{1,4})/);
    if (!m) return '';
    return m[2] ? Number(m[1]) + '-' + Number(m[2]) : String(Number(m[1]));
  }

  function bulkUpload(input) {
    var files = Array.prototype.slice.call(input.files || []);
    input.value = '';
    if (!files.length) return;
    var replace = !!(document.getElementById('bulk-replace') || {}).checked;
    var a = state.terrAdmin;
    a.bulk = files.map(function (f) { return { file: f.name, state: 'wait', msg: '待機中' }; });
    render();
    var done = 0, ok = 0;
    files.reduce(function (p, f, i) {
      return p.then(function () {
        var row = a.bulk[i];
        var label = labelFromFileName(f.name);
        if (!label) { row.state = 'ng'; row.msg = 'ファイル名に番号がないため、登録しませんでした'; render(); return; }
        row.state = 'run';
        row.msg = '区域' + label + 'として登録中…';
        render();
        return mapFileToJpeg(f).then(function (b64) {
          return call('api_saveMapCard', state.token, label, '', 'image/jpeg', b64, replace);
        }).then(function (r) {
          ok++;
          row.state = 'ok';
          row.msg = '区域' + label + (r.replaced ? 'の地図を差し替えました' : 'を登録しました');
        }, function (e) {
          row.state = 'ng';
          row.msg = errorText(e);
        }).then(function () {
          done++;
          if (state.screen === 'terrAdmin') render();
        });
      });
    }, Promise.resolve()).then(function () {
      toast(ok + '件を登録しました' + (ok < files.length ? '（' + (files.length - ok) + '件は登録できませんでした）' : '。'), ok < files.length);
      state.terrAdmin.selected = null;
      loadTerritories();
    });
  }

  // ---------- 自動更新 ----------
  // チャット画面：5秒ごと、メッセージ一覧：15秒ごと、未読バッジ：60秒ごと
  var tick = 0;
  var polling = false;
  setInterval(function () {
    if (!state.token || polling) return;
    if (document.visibilityState && document.visibilityState !== 'visible') return;
    tick++;
    var job = null;
    if (state.screen === 'chat' && state.chat && state.chat.data) {
      var id = state.chat.convId;
      job = call('api_pollChat', state.token, id, state.chat.data.version).then(function (r) {
        if (r.changed && state.chat && state.chat.convId === id) applyChat(r, false);
      });
    } else if (state.screen === 'inbox' && tick % 3 === 0) {
      job = refreshInbox();
    } else if (tick % 12 === 0) {
      job = call('api_homeSummary', state.token, todayStr()).then(function (s) {
        var changed = JSON.stringify(s.unread) !== JSON.stringify(state.summary.unread) || s.chatUnread !== state.summary.chatUnread;
        state.summary = s;
        cache.set('summary', s);
        if (changed && SAFE_TO_RENDER.indexOf(state.screen) >= 0) render();
      });
    }
    if (job) {
      polling = true;
      job.then(function () { polling = false; }, function () { polling = false; });
    }
  }, 5000);

  function uploadSelected(input) {

        }).then(function (f) {

          refreshAttList(target);

    }, Promise.resolve()).catch(function (e) {

  function prepareFile(file) {
    var type = file.type || '';
    if (type === 'application/pdf') {
      if (file.size > MAX_PDF_BYTES) return Promise.reject(new Error('「' + file.name + '」は5MBを超えているため添付できません。'));
      return readDataUrl(file).then(function (d) {
        return { name: file.name, mime: 'application/pdf', base64: d.split(',')[1] };
      });
    }
    if (type.indexOf('image/') === 0) {
      return readDataUrl(file).then(function (d) {
        return shrinkImage(d, 1600, 0.82);
      }).then(function (b64) {
        var base = (file.name || 'image').replace(/\.[^.]+$/, '');
        return { name: base + '.jpg', mime: 'image/jpeg', base64: b64 };
      });
    }
    return Promise.reject(new Error('「' + file.name + '」は添付できない形式です。画像かPDFを選んでください。'));
  }

  function readDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = function () { reject(new Error('ファイルを読み込めませんでした。')); };
      r.readAsDataURL(file);
    });
  }

  // アイコン：中央を正方形に切り抜いて 512×512 の PNG にする
  function keepAppName() {
    var n = document.getElementById('as-name');
    if (n) state.appNameDraft = n.value;
    var form = n && n.form;
    if (form) {
      state.appFeatDraft = {};
      Object.keys(FEATURE_NAMES).forEach(function (k) { var c = form['feat_' + k]; if (c) state.appFeatDraft[k] = c.checked; });
    }
  }
  function pickAppIcon(input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    keepAppName();
    readDataUrl(file).then(function (url) {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
          var c = document.createElement('canvas');
          c.width = 512; c.height = 512;
          var ctx = c.getContext('2d');
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, 0, 512, 512);
          ctx.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, 512, 512);
          // 画面表示用の小さい版（192px・JPEG）
          var s2 = document.createElement('canvas');
          s2.width = 192; s2.height = 192;
          s2.getContext('2d').drawImage(c, 0, 0, 192, 192);
          state.appIconSmall = s2.toDataURL('image/jpeg', 0.88).split(',')[1];
          resolve(c.toDataURL('image/png').split(',')[1]);
        };
        img.onerror = function () { reject(new Error('この画像は読み込めませんでした。JPGかPNGでお試しください。')); };
        img.src = url;
      });
    }).then(function (b64) {
      state.appIcon = b64;
      state.appIconRemove = false;
      render();
    }).catch(function (e) { toast(e.message, true); });
  }

  function shrinkImage(dataUrl, max, quality) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, max / Math.max(w, h));
        w = Math.round(w * s);
        h = Math.round(h * s);
        var c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality).split(',')[1]);
      };
      img.onerror = function () { reject(new Error('この画像は読み込めませんでした。JPGかPNGでお試しください。')); };
      img.src = dataUrl;
    });
  }

  // 表示用：画像はサムネイル、PDFはファイル名

        '<span class="att-name">' + esc(f.name) + '</span><span class="muted small">' + fmtSize(f.size) + '</span></button>';
    }).join('');
    return '<div class="att-view">' + html + '</div>';

  function loadFile(id) {
    if (!fileCache[id]) {
      fileCache[id] = call('api_getFile', state.token, id).then(function (r) {
        var bin = atob(r.data);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        var url = URL.createObjectURL(new Blob([arr], { type: r.mime }));
        return { url: url, name: r.name, mime: r.mime, bytes: arr };
      });
      fileCache[id].catch(function () { delete fileCache[id]; });
    }
    return fileCache[id];
  }

  function hydrateImages() {

  // ---------- PDFをアプリ内で表示（PDF.js） ----------
  var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  var PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var PDFJS_ASSETS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/';
  var PDF_ZOOMS = [1, 1.5, 2];
  var pdfjsPromise = null;
  var pdfView = null;   // { doc, name, url, zoomIndex, gen }
  var pdfGen = 0;

  function loadPdfJs() {
    if (!pdfjsPromise) {
      pdfjsPromise = new Promise(function (resolve, reject) {
        if (window.pdfjsLib) {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
          resolve(window.pdfjsLib);
          return;
        }
        var s = document.createElement('script');
        s.src = PDFJS_URL;
        s.onload = function () {
          if (!window.pdfjsLib) { reject(new Error('PDFを表示する準備に失敗しました。')); return; }
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_URL;
          resolve(window.pdfjsLib);
        };
        s.onerror = function () { reject(new Error('PDFを表示する準備に失敗しました。通信状況を確認してください。')); };
        document.head.appendChild(s);
      });
      pdfjsPromise.catch(function () { pdfjsPromise = null; });
    }
    return pdfjsPromise;
  }

  function viewPdf(id) {
    var meta = fileMeta[id] || {};
    var gen = ++pdfGen;
    openViewer('<div class="viewer-body"><div class="spinner"></div></div>');
    return Promise.all([loadFile(id), loadPdfJs()]).then(function (r) {
      var f = r[0], lib = r[1];
      return lib.getDocument({
        data: f.bytes.slice(),
        // 日本語フォントを埋め込んでいないPDFも正しく表示するための設定
        cMapUrl: PDFJS_ASSETS_URL + 'cmaps/',
        cMapPacked: true,
        standardFontDataUrl: PDFJS_ASSETS_URL + 'standard_fonts/'
      }).promise.then(function (doc) {
        if (gen !== pdfGen || !$viewer || $viewer.hidden) { doc.destroy(); return; }
        pdfView = { doc: doc, name: f.name || meta.name || 'PDF', url: f.url, zoomIndex: 0, gen: gen };
        $viewer.className = 'viewer pdf-mode';
        openViewer(
          '<div class="pdfbar">' +
            '<div class="pdf-title">' + esc(pdfView.name) + '<span class="pdf-count">' + doc.numPages + 'ページ</span></div>' +
            '<div class="pdf-tools">' +
              '<button type="button" data-action="pdfZoom" data-d="-1" aria-label="縮小">−</button>' +
              '<span id="pdf-zoom">100%</span>' +
              '<button type="button" data-action="pdfZoom" data-d="1" aria-label="拡大">＋</button>' +
              '<a class="pdf-save" href="' + f.url + '" download="' + esc(pdfView.name) + '">保存</a>' +
            '</div>' +
          '</div>' +
          '<div class="pdf-pages" id="pdf-pages"></div>'
        );
        return renderPdfPages(gen);
      });
    }).catch(function (e) {
      if (gen !== pdfGen) return;
      closeViewer();
      handleError(e && e.name === 'InvalidPDFException' ? new Error('このPDFは開けませんでした。ファイルが壊れている可能性があります。') : e);
    });
  }

  function renderPdfPages(gen) {
    var box = document.getElementById('pdf-pages');
    if (!box || !pdfView) return Promise.resolve();
    var doc = pdfView.doc;
    var dpr = window.devicePixelRatio || 1;
    var targetW = Math.min(2000, Math.max(800, (box.clientWidth - 16) * Math.min(3, dpr * 1.5)));
    var n = doc.numPages;
    var chain = Promise.resolve();
    for (var i = 1; i <= n; i++) {
      (function (num) {
        chain = chain.then(function () {
          if (!pdfView || pdfView.gen !== gen) return;
          return doc.getPage(num).then(function (page) {
            var base = page.getViewport({ scale: 1 });
            var vp = page.getViewport({ scale: targetW / base.width });
            var canvas = document.createElement('canvas');
            canvas.width = Math.floor(vp.width);
            canvas.height = Math.floor(vp.height);
            canvas.className = 'pdf-page';
            canvas.style.width = (PDF_ZOOMS[pdfView.zoomIndex] * 100) + '%';
            canvas.setAttribute('aria-label', num + 'ページ目');
            box.appendChild(canvas);
            return page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
          });
        });
      })(i);
    }
    return chain;
  }

  function pdfZoom(d) {
    if (!pdfView) return;
    pdfView.zoomIndex = Math.max(0, Math.min(PDF_ZOOMS.length - 1, pdfView.zoomIndex + d));
    var z = PDF_ZOOMS[pdfView.zoomIndex];
    var label = document.getElementById('pdf-zoom');
    if (label) label.textContent = Math.round(z * 100) + '%';
    Array.prototype.forEach.call(document.querySelectorAll('#pdf-pages .pdf-page'), function (c) {
      c.style.width = (z * 100) + '%';
    });
  }

  function viewFile(id) {
    var meta = fileMeta[id] || {};
    if (isImage(meta)) {
      openViewer('<div class="viewer-body"><div class="spinner"></div></div>');
      return loadFile(id).then(function (f) {

      }, function (e) { closeViewer(); handleError(e); });
    }
    return viewPdf(id);
  }

        '<div><div class="member-name">' + esc(m.name) + (self ? '（あなた）' : '') + ' ' + badges + '</div>' +

      var data = {

        allDay: fm.allDay.checked,
        startTime: fm.startTime.value,

      if (!e) return;
      state.eventView = e;
      state.eventBack = state.screen === 'group' ? 'group' : (state.screen === 'home' ? 'home' : 'calendar');
      go('event');
    },
    newEvent: function () {
      var c = ensureCal();
      openEventForm('new', null, state.screen === 'calendar' ? c.sel : todayStr());
    },
    editEvent: function () {
      var e = state.eventView;
      if (e.repeat === 'none') { openEventForm('all', e, e.date); return; }
      return choose('繰り返しの予定です。どの回を変更しますか？', REPEAT_SCOPES).then(function (k) {
        if (k) openEventForm(k, e, e.date);
      });
    },
    deleteEvent: function () {
      var e = state.eventView;
      var ask = e.repeat === 'none'
        ? choose('「' + e.title + '」を削除しますか？', [['all', '削除する', 'danger']])
        : choose('繰り返しの予定です。どの回を削除しますか？', REPEAT_SCOPES.map(function (o) { return [o[0], o[1], 'danger']; }));
      return ask.then(function (k) {
        if (!k) return;
        return run('api_deleteEvent', state.token, e.id, k, e.date).then(function () {
          toast('削除しました。');
          if (state.eventBack === 'group') { state.groupTab = 'calendar'; go('group'); return; }
          go('calendar');
        });
      });
    },
    choose: function (el) {
      closeChoose(el.getAttribute('data-key'));
    },
    removeAtt: function (el) {
      var target = el.getAttribute('data-target');
      attFiles(target).splice(Number(el.getAttribute('data-i')), 1);
      refreshAttList(target);
    },
    viewFile: function (el) {
      return viewFile(el.getAttribute('data-id'));
    },
    closeViewer: function () {
      closeViewer();
    },
    pdfZoom: function (el) {
      pdfZoom(Number(el.getAttribute('data-d')));
    },
    backToPost: function () {
      if (state.compose && state.compose.post) openPost(state.compose.post.id);
      else go('board');
    },
    deletePost: function () {
      var p = state.current.post;
      if (!confirm('「' + p.title + '」を削除しますか？')) return;
      return run('api_deletePost', state.token, p.id).then(function () {
        toast('削除しました。');
        if (p.groupId && state.postFrom === 'group') {
          state.groupPosts = (state.groupPosts || []).filter(function (x) { return x.id !== p.id; });
          state.groupTab = 'board';
          go('group');
          return;
        }
        var tabKey = p.groupId ? 'groups' : p.type;
        var cached = cache.get('posts:' + tabKey);
        if (cached) cache.set('posts:' + tabKey, cached.filter(function (x) { return x.id !== p.id; }));
        state.boardTab = tabKey;
        go('board');
      });
    },
    deleteComment: function (el) {
      if (!confirm('このコメントを削除しますか？')) return;
      return run('api_deleteComment', state.token, el.getAttribute('data-id')).then(function (list) {
        state.current.comments = list;
        render();
      });
    }
  };

  function fallbackCopy(ta) {
    try { ta.select(); return document.execCommand('copy'); } catch (e) { return false; }
  }

  function findMember(id) {
    for (var i = 0; i < state.members.length; i++) if (state.members[i].id === id) return state.members[i];
    return null;
  }

  function updateMember(id, changes) {
    return run('api_updateMember', state.token, id, changes).then(function (m) {
      for (var i = 0; i < state.members.length; i++) if (state.members[i].id === id) state.members[i] = m;
      if (state.user && m.id === state.user.id) {
        state.user.role = m.role;
        state.user.territoryAdmin = m.territoryAdmin;
        state.user.calendarEditor = m.calendarEditor;
        cache.set('user', state.user);
      }
      toast('更新しました。');
      render();
    }, function () { render(); });
  }

  // ---------- イベント ----------
  document.addEventListener('submit', function (e) {
    var f = e.target;
    var name = f.getAttribute('data-form');
    if (!name || !forms[name]) return;
    e.preventDefault();
    Promise.resolve(forms[name](f)).catch(function () {});
  });

  document.addEventListener('click', function (e) {
    if ($viewer && e.target === $viewer) { closeViewer(); return; }
    if (e.target.id === 'dlg') { if (formResolve) closeFormDialog(null); else closeChoose(null); return; }
    // 本文中のリンクはそのまま開く
    var link = e.target.closest('a[href]');
    if (link && !link.hasAttribute('data-action') && !link.hasAttribute('data-go')) return;
    var el = e.target.closest('[data-go],[data-action]');
    if (!el || el.disabled) return;
    var to = el.getAttribute('data-go');
    if (to) { e.preventDefault(); go(to); return; }
    var a = el.getAttribute('data-action');
    if (actions[a]) {
      e.preventDefault();
      Promise.resolve(actions[a](el)).catch(function () {});
    }
  });

  // 名前での絞り込み・入力欄の自動の高さ調整
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.getAttribute('data-filter') === 'terr') {
      var tq = el.value.trim().toLowerCase();
      var nq = normTerrLabel(tq);
      var match = function (row) {
        var name = (row.getAttribute('data-name') || '').toLowerCase();
        if (!tq) return true;
        if (nq) {
          // 番号で探すとき：「3」は区域3とその枝番、「3-2」は区域3-2だけ
          var no = name.split(' ')[0];
          return no === nq || (nq.indexOf('-') < 0 && no.split('-')[0] === nq);
        }
        return name.indexOf(tq) >= 0;
      };
      Array.prototype.forEach.call(document.querySelectorAll('.terr-list'), function (list) {
        Array.prototype.forEach.call(list.children, function (node) {
          if (node.classList.contains('terr-row')) { node.hidden = !match(node); return; }
          if (!node.classList.contains('terr-group')) return;
          var any = false;
          Array.prototype.forEach.call(node.querySelectorAll('.terr-row'), function (row) {
            var ok = match(row);
            row.hidden = !ok;
            if (ok) any = true;
          });
          node.hidden = !any;
          var box = node.querySelector('.terr-children');
          var btn = node.querySelector('.terr-parent');
          var open = tq ? true : !!terrOpen[btn.getAttribute('data-key')];
          box.hidden = !open;
          btn.setAttribute('aria-expanded', String(open));
        });
      });
    }
    if (el.getAttribute('data-filter') === 'users') {
      var q = el.value.trim().toLowerCase();
      var root = el.parentNode;
      Array.prototype.forEach.call(root.querySelectorAll('.user-item'), function (item) {
        var name = (item.getAttribute('data-name') || '').toLowerCase();
        item.hidden = !!q && name.indexOf(q) < 0;
      });
    }
    if (el.getAttribute('data-autogrow')) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.getAttribute('data-upload') === 'terrBulk') { bulkUpload(el); return; }
    if (el.getAttribute('data-upload') === 'terrReplace') { replaceMap(el); return; }
    if (el.getAttribute('data-upload') === 'appIcon') { pickAppIcon(el); return; }
    if (el.getAttribute('data-upload')) { uploadSelected(el); return; }
    var kind = el.getAttribute('data-change');
    if (!kind) return;
    var id = el.getAttribute('data-id');
    if (kind === 'role') updateMember(id, { role: el.value }).catch(function () {});
    if (kind === 'territory') updateMember(id, { territoryAdmin: el.checked }).catch(function () {});
    if (kind === 'calendar') updateMember(id, { calendarEditor: el.checked }).catch(function () {});
    if (kind === 'digest') {
      var on = el.checked;
      run('api_setDigest', state.token, on).then(function (u) {
        state.user = u;
        cache.set('user', u);
        toast(on ? 'まとめメールを受け取ります。' : 'まとめメールを止めました。');
      }).catch(function () { el.checked = !on; });
    }
    // 予定フォームの表示切り替え（入力内容を消さないよう、部分的に書き換える）
    if (kind === 'evRepeat') {
      var w = document.getElementById('ev-weekly');
      var u = document.getElementById('ev-until');
      if (w) w.hidden = el.value !== 'weekly';
      if (u) u.hidden = el.value === 'none';
    }
    if (kind === 'evAllDay') {
      var t = document.getElementById('ev-times');
      if (t) t.hidden = el.checked;
    }
    if (kind === 'evDate' && el.value) {
      var ml = monthLabels(el.value);
      var md = document.getElementById('ev-opt-md');
      var mn = document.getElementById('ev-opt-mn');
      if (md) md.textContent = ml.date;
      if (mn) mn.textContent = ml.nth;
    }
  });

  // ---------- 起動 ----------
  function init() {
    var t = store.get();
    if (!t) { go('login'); return; }
    state.token = t;
    // 前回の内容があれば、すぐにホームを表示する
    var cachedUser = cache.get('user');
    if (cachedUser) {
      state.user = cachedUser;
      state.summary = cache.get('summary') || state.summary;
      state.screen = 'home';
    }
    render();
    // ログイン確認とホームの情報を1回の通信で取得
    call('api_bootstrap', t, todayStr()).then(function (r) {
      state.user = r.user;
      state.summary = r.summary;
      cache.set('user', r.user);
      cache.set('summary', r.summary);
      if (state.screen === 'loading') state.screen = 'home';
      if (state.screen === 'home') render();
    }, function (e) {
      if (errorText(e).indexOf('AUTH') >= 0) {
        store.clear();
        cache.clear();
        state.token = null;
        state.user = null;
        go('login');
      } else if (state.screen === 'loading') {
        $app.innerHTML = '<div class="loading"><div>読み込みに失敗しました。通信状況を確認して、再読み込みしてください。</div></div>';
      } else {
        handleError(e);
      }
    });
  }

  init();
})();
</script>
