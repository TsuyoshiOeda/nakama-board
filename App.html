<script>
(function () {
  'use strict';

  var APP_NAME = document.body.getAttribute('data-app-name') || 'なかまボード';
  var ICON_URL = document.body.getAttribute('data-icon-url') || '';
  var $app = document.getElementById('app');
  var $overlay = document.getElementById('overlay');
  var $toast = document.getElementById('toast');

  var state = {
    token: null,
    user: null,
    screen: 'loading',
    // 管理
    adminTab: 'members',
    members: [],
    invites: [],
    lastInvite: null,
    tempPw: null,
    // 掲示板
    summary: { unread: { board: 0, notice: 0 }, notices: [], upcoming: [] },
    boardTab: 'board',
    posts: null,
    current: null,      // { post, comments }
    compose: null,      // { mode: 'new'|'edit', type, post, files }
    commentFiles: [],   // コメントに添付するファイル
    // カレンダー
    cal: null,          // { y, m, sel, events, canEdit }
    eventView: null,    // 表示中の予定（1回分）
    eventForm: null,    // { mode, ev, date, groupId }
    eventBack: null,    // 予定の詳細から戻る先
    // グループ・メッセージ
    groups: null,       // 自分のグループ一覧
    group: null,        // 表示中のグループ { group, members }
    groupTab: 'board',
    groupPosts: null,
    groupEvents: null,
    groupForm: null,    // { mode: 'new'|'edit', selected: {} }
    users: null,        // メンバー一覧（選択用）
    picker: null,       // { mode: 'dm'|'addMembers', title, back }
    inbox: null,
    chat: null,         // { convId, data, files, sending }
    chatBack: null,
    // 区域カード
    terr: null,         // { isAdmin, dueDays, cards }
    terrCard: null,     // 表示中のカードの詳細
    terrTab: 'map',
    terrFilter: '',
    terrAdmin: null,    // 管理画面の選択状態 { selected: {} }
    terrBack: 'territory'
  };
  var eventIndex = {};  // "id|date" → 予定（1回分）

  var MAX_FILES = 5;
  var MAX_PDF_BYTES = 5 * 1024 * 1024;
  var fileMeta = {};    // id → { id, name, mime, size }
  var fileCache = {};   // id → Promise<{ url, name, mime }>

  // ---------- 保存（ブラウザ） ----------
  var store = {
    get: function () { try { return localStorage.getItem('ga_token'); } catch (e) { return null; } },
    set: function (v) { try { localStorage.setItem('ga_token', v); } catch (e) {} },
    clear: function () { try { localStorage.removeItem('ga_token'); } catch (e) {} }
  };

  // 前回の表示内容（この端末だけに保存。ログアウトで消去）
  var cache = (function () {
    var KEY = 'ga_cache';
    var data = {};
    try { data = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { data = {}; }
    var timer = null;
    function save() {
      clearTimeout(timer);
      timer = setTimeout(function () {
        try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {
          // 容量不足などの場合は保存をあきらめる（表示には影響しない）
          try { localStorage.removeItem(KEY); } catch (e2) {}
        }
      }, 300);
    }
    return {
      get: function (k) { return data.hasOwnProperty(k) ? data[k] : null; },
      set: function (k, v) {
        // カレンダーは直近の数か月分だけ残す
        if (k.indexOf('cal:') === 0) {
          var keys = Object.keys(data).filter(function (x) { return x.indexOf('cal:') === 0 && x !== k; });
          while (keys.length >= 4) delete data[keys.shift()];
        }
        data[k] = v;
        save();
      },
      clear: function () {
        data = {};
        clearTimeout(timer);
        try { localStorage.removeItem(KEY); } catch (e) {}
      }
    };
  })();

  // 入力欄の内容を残したまま再描画する
  function renderKeepingInput(id) {
    var el = document.getElementById(id);
    var value = el ? el.value : '';
    var focused = el && document.activeElement === el;
    render();
    var el2 = document.getElementById(id);
    if (el2 && value) el2.value = value;
    if (el2 && focused) el2.focus();
  }

  // ---------- サーバー呼び出し ----------
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[fn].apply(runner, args);
    });
  }

  function run() {
    var args = arguments;
    setBusy(true);
    return call.apply(null, args).then(function (r) {
      setBusy(false);
      return r;
    }, function (e) {
      setBusy(false);
      handleError(e);
      throw e;
    });
  }

  function errorText(e) {
    var m = (e && e.message) ? e.message : String(e);
    return m.replace(/^(Exception|Error):\s*/, '');
  }

  function handleError(e) {
    var m = errorText(e);
    if (m.indexOf('AUTH') >= 0) {
      store.clear();
      cache.clear();
      state.token = null;
      state.user = null;
      go('login');
      toast('もう一度ログインしてください。', true);
      return;
    }
    toast(m, true);
  }

  // ---------- 表示の補助 ----------
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 本文：エスケープした上でURLだけリンクにする
  function richText(s) {
    return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function fmtDay(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function setBusy(b) { $overlay.hidden = !b; }

  var toastTimer = null;
  function toast(msg, isError) {
    $toast.textContent = msg;
    $toast.className = 'toast' + (isError ? ' error' : '');
    $toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.hidden = true; }, isError ? 5000 : 3500);
  }

  var ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path>',
    board: '<rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path>',
    user: '<circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>',
    gear: '<circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path>',
    group: '<circle cx="9" cy="8" r="3"></circle><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 14.2c2.9.4 5 2.8 5 5.8"></path>',
    back: '<path d="M15 5l-7 7 7 7"></path>',
    next: '<path d="M9 5l7 7-7 7"></path>',
    cal: '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path>',
    pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle>',
    chat: '<path d="M4 5h16v11H9l-5 4z"></path>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"></path>',
    map: '<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path>',
    hand: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12"></path><path d="M11 11.5v-2a1.5 1.5 0 0 1 3 0V12"></path><path d="M14 10.5a1.5 1.5 0 0 1 3 0V12"></path><path d="M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.6-2.2L4.6 16a1.5 1.5 0 0 1 2.3-1.9L8 15.5"></path>',
    pen: '<path d="M4 20l4-1 11-11-3-3L5 16z"></path><path d="M14 6l3 3"></path>',
    undo: '<path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path>',
    warn: '<path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17h.01"></path>',
    eraser: '<path d="M16 3.5 20.5 8a1.5 1.5 0 0 1 0 2.1L11 19.6H6.5L3.5 16.6a1.5 1.5 0 0 1 0-2.1L13.9 3.5a1.5 1.5 0 0 1 2.1 0z"></path><path d="M9 9l6.5 6.5"></path><path d="M11 19.6h9"></path>',
    open: '<path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 3"></path>',
    send: '<path d="M4 12 20 4l-6 16-3-7z"></path>',
    clip: '<path d="M21 11.5 12.5 20a5 5 0 0 1-7-7L14 4.5a3.3 3.3 0 0 1 4.7 4.7L10.2 17.7a1.7 1.7 0 0 1-2.4-2.4L15.5 7.6"></path>',
    repeat: '<path d="M17 2l3 3-3 3"></path><path d="M4 11V9a4 4 0 0 1 4-4h12"></path><path d="M7 22l-3-3 3-3"></path><path d="M20 13v2a4 4 0 0 1-4 4H4"></path>',
    plus: '<path d="M12 5v14M5 12h14"></path>'
  };
  function icon(name, size) {
    size = size || 22;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
  }

  function isAdmin() { return state.user && state.user.role === 'admin'; }
  function totalUnread() { var u = state.summary.unread; return (u.board || 0) + (u.notice || 0) + (u.group || 0); }

  // ---------- 画面切り替え ----------
  function go(screen) {
    // 地図の書き込みが保存待ちなら、画面を移る前に保存する
    if (ink.dirty) { clearTimeout(ink.saveTimer); saveInk(); }
    // オフになっている機能の画面には入らない
    var needs = { board: 'board', post: 'board', compose: 'board', calendar: 'calendar', event: 'calendar', eventForm: 'calendar',
      inbox: 'chat', chat: 'chat', groups: 'groups', group: 'groups', groupForm: 'groups' };
    var need = needs[screen] || (/^terr/.test(screen) || screen === 'territory' ? 'cards' : '');
    if (need && !featOn(need)) screen = 'home';
    state.screen = screen;
    render();
    window.scrollTo(0, 0);
    if (screen === 'admin') loadAdmin();
    if (screen === 'home') loadSummary();
    if (screen === 'board') loadPosts();
    if (screen === 'calendar') loadCalendar();
    if (screen === 'inbox') loadInbox();
    if (screen === 'groups') loadGroups();
    if (screen === 'group') loadGroup();
    if (screen === 'territory') loadTerritories();
    if (screen === 'terrAdmin') loadTerritories();
  }

  function render() {
    var html;
    switch (state.screen) {
      case 'login': html = viewLogin(); break;
      case 'register': html = viewRegister(); break;
      case 'home': html = shell('ホーム', viewHome(), 'home'); break;
      case 'board': html = shell('掲示板', viewBoard(), 'board', { right: boardRight() }); break;
      case 'post': html = shell(postTitle(), viewPost(), postNav(), { back: postBackTarget() }); break;
      case 'compose': html = shell(composeTitle(), viewCompose(), postNav(), { back: state.compose && state.compose.mode === 'edit' ? 'postBack' : postBackTarget() }); break;
      case 'calendar': html = shell('予定', viewCalendar(), 'calendar', { right: calTargets().length ? '<button class="pill" data-action="newEvent">' + icon('plus', 16) + '追加</button>' : '' }); break;
      case 'event': html = shell('予定', viewEvent(), 'calendar', { back: state.eventBack || 'calendar' }); break;
      case 'eventForm': html = shell(eventFormTitle(), viewEventForm(), 'calendar', { back: eventFormBack() }); break;
      case 'inbox': html = shell('メッセージ', viewInbox(), 'inbox', { right: '<button class="pill" data-action="newDm">' + icon('plus', 16) + '新規</button>' }); break;
      case 'chat': html = shell(state.chat && state.chat.data ? state.chat.data.conv.title : 'トーク', viewChat(), 'inbox', { back: state.chatBack || 'inbox', noNav: true }); break;
      case 'pickUsers': html = shell(state.picker ? state.picker.title : '', viewPicker(), state.picker && state.picker.mode === 'dm' ? 'inbox' : 'menu', { back: state.picker ? state.picker.back : 'menu' }); break;
      case 'menu': html = shell('メニュー', viewMenu(), 'menu'); break;
      case 'groups': html = shell('グループ', viewGroups(), 'menu', { back: 'menu', right: '<button class="pill" data-action="newGroup">' + icon('plus', 16) + '作成</button>' }); break;
      case 'group': html = shell(state.group ? state.group.group.name : 'グループ', viewGroup(), 'menu', { back: 'groups' }); break;
      case 'groupForm': html = shell(state.groupForm && state.groupForm.mode === 'edit' ? 'グループの設定' : 'グループを作成', viewGroupForm(), 'menu', { back: state.groupForm && state.groupForm.mode === 'edit' ? 'group' : 'groups' }); break;
      case 'territory': html = shell('区域カード', viewTerritory(), 'territory', { right: state.terr && state.terr.isAdmin ? '<button class="pill" data-go="terrAdmin">' + icon('gear', 16) + '管理</button>' : '' }); break;
      case 'terrCard': html = shell(state.terrCard ? terrTitle(state.terrCard) : '区域カード', viewTerrCard(), 'territory', { back: state.terrBack || 'territory' }); break;
      case 'terrAdmin': html = shell('区域カードの管理', viewTerrAdmin(), 'territory', { back: 'territory' }); break;
      case 'terrLend': html = shell('代理で貸し出す', viewTerrLend(), 'territory', { back: 'terrCard' }); break;
      case 'terrHistory': html = shell('使用履歴', viewTerrHistory(), 'territory', { back: 'terrCard' }); break;
      case 'terrEdit': html = shell(state.terrEdit && state.terrEdit.card ? (isList(state.terrEdit.card) ? 'リストを編集' : '区域カードを編集') : 'リストを登録', viewTerrEdit(), 'territory', { back: state.terrEdit && state.terrEdit.card ? 'terrCard' : 'terrAdmin' }); break;
      case 'account': html = shell('アカウント', viewAccount(), 'menu', { back: 'menu' }); break;
      case 'admin': html = shell('全体の管理', viewAdmin(), 'menu', { back: 'menu' }); break;
      default: html = '<div class="loading"><div class="spinner"></div><div>読み込み中…</div></div>';
    }
    $app.innerHTML = html;
    hydrateImages();
    if (state.screen === 'terrCard') mountMap();
    else document.body.classList.remove('map-full-open');
  }

  // アプリ全体の機能のオン・オフ（全体管理者が「アプリ設定」で決める）
  var FEATURE_NAMES = { board: '掲示板', calendar: '予定（カレンダー）', chat: 'メッセージ', groups: 'グループ', cards: '共有カード' };
  function featOn(f) {
    var fs = state.user && state.user.features;
    return !fs || fs[f] !== false;
  }

  function shell(title, body, active, opts) {
    opts = opts || {};
    var items = [['home', 'home', 'ホーム'], ['board', 'board', '掲示板', 'board'], ['inbox', 'chat', 'メッセージ', 'chat'], ['calendar', 'cal', '予定', 'calendar'], ['territory', 'map', '区域', 'cards'], ['menu', 'menu', 'メニュー']]
      .filter(function (it) { return !it[3] || featOn(it[3]); });
    var ts = state.summary.territory;
    var counts = { board: totalUnread(), inbox: state.summary.chatUnread || 0, territory: ts && ts.alerts ? ts.alerts.length : 0 };
    var nav = items.map(function (it) {
      var n = counts[it[0]] || 0;
      var badge = n > 0 ? '<span class="badge">' + (n > 99 ? '99+' : n) + '</span>' : '';
      return '<button data-go="' + it[0] + '" class="' + (active === it[0] ? 'on' : '') + '">' + icon(it[1]) + '<span>' + it[2] + '</span>' + badge + '</button>';
    }).join('');
    var back = opts.back
      ? (opts.back === 'postBack'
        ? '<button class="iconbtn" data-action="backToPost" aria-label="戻る">' + icon('back') + '</button>'
        : '<button class="iconbtn" data-go="' + opts.back + '" aria-label="戻る">' + icon('back') + '</button>')
      : '';
    return '<header class="topbar"><div class="left">' + back + '<h1>' + esc(title) + '</h1></div>' + (opts.right || '') + '</header>' +
      '<main class="main' + (opts.noNav ? ' no-nav' : '') + '">' + body + '</main>' +
      (opts.noNav ? '' : '<nav class="nav"><div class="nav-inner">' + nav + '</div></nav>');
  }

  // ---------- ログイン ----------
  function viewLogin() {
    return '<div class="auth">' +
      '<div class="brand">' + (ICON_URL ? '<img class="logo logo-img" src="' + esc(ICON_URL) + '" alt="">' : '<div class="logo">' + icon('group', 32) + '</div>') +
      '<h1>' + esc(APP_NAME) + '</h1><div class="muted small">招待されたメンバーのみ利用できます</div></div>' +
      '<form class="card stack" data-form="login" autocomplete="on">' +
        '<div class="field"><label for="f-login">ログインID</label><input id="f-login" name="loginId" type="text" autocomplete="username" autocapitalize="none" required></div>' +
        '<div class="field"><label for="f-pw">パスワード</label><input id="f-pw" name="password" type="password" autocomplete="current-password" required></div>' +
        '<button class="btn primary block" type="submit">ログイン</button>' +
        '<div class="muted small center">パスワードを忘れた場合は、全体管理者に再設定を依頼してください。</div>' +
      '</form>' +
      '<div class="stack center"><div class="muted small">はじめての方</div>' +
      '<button class="btn outline block" data-go="register">招待コードで登録</button></div>' +
    '</div>';
  }

  function viewRegister() {
    return '<div class="auth">' +
      '<div class="brand"><h1>メンバー登録</h1><div class="muted small">管理者から受け取った招待コードを入力してください</div></div>' +
      '<form class="card stack" data-form="register" autocomplete="on">' +
        '<div class="field"><label for="r-code">招待コード</label><input id="r-code" name="code" type="text" autocapitalize="characters" required></div>' +
        '<div class="field"><label for="r-login">ログインID</label><input id="r-login" name="loginId" type="text" autocomplete="username" autocapitalize="none" required><div class="hint">半角英数字3〜30文字（記号は _ . - のみ）</div></div>' +
        '<div class="field"><label for="r-name">表示名</label><input id="r-name" name="name" type="text" maxlength="30" required><div class="hint">他のメンバーに表示される名前です</div></div>' +
        '<div class="field"><label for="r-pw">パスワード</label><input id="r-pw" name="password" type="password" autocomplete="new-password" required><div class="hint">8文字以上</div></div>' +
        '<div class="field"><label for="r-pw2">パスワード（確認）</label><input id="r-pw2" name="password2" type="password" autocomplete="new-password" required></div>' +
        '<div class="field"><label for="r-mail">メールアドレス（任意）</label><input id="r-mail" name="email" type="email" autocomplete="email"><div class="hint">お知らせや未読の通知に使います。Gmail以外も可</div></div>' +
        '<button class="btn primary block" type="submit">登録する</button>' +
      '</form>' +
      '<button class="linkbtn" data-go="login">ログイン画面に戻る</button>' +
    '</div>';
  }

  // ---------- ホーム ----------
  function viewHome() {
    var u = state.user;
    var s = state.summary;
    var badges = '';
    if (u.role === 'admin') badges += ' <span class="tag admin">全体管理者</span>';
    if (u.territoryAdmin) badges += ' <span class="tag terr">区域カード管理者</span>';
    if (u.calendarEditor && u.role !== 'admin') badges += ' <span class="tag cal">カレンダー編集者</span>';

    var notices = s.notices.length
      ? s.notices.map(function (n) {
          return '<button class="notice-row" data-action="openPost" data-id="' + esc(n.id) + '">' +
            '<div class="post-meta">' + (n.important ? '<span class="tag imp">重要</span>' : '') + fmtDate(n.createdAt) + (n.isRead ? '' : '<span class="dot" aria-label="未読"></span>') + '</div>' +
            '<div style="font-weight:500">' + esc(n.title) + '</div></button>';
        }).join('')
      : '<div class="muted small" style="padding:8px 0">お知らせはまだありません</div>';

    var upcoming = (s.upcoming || []).length
      ? s.upcoming.map(eventRow).join('')
      : '<div class="muted small" style="padding:8px 0">7日以内の予定はありません</div>';

    var ts = s.territory || { holding: 0, alerts: [] };
    var soon = '<button class="tile link" data-go="territory"><div class="label">区域カード</div><div class="num">' + (ts.holding || 0) + '<span class="small muted" style="font-weight:400"> 枚を借りています</span></div></button>';
    var terrAlerts = (ts.alerts || []).map(function (a) {
      var msg = a.kind === 'return' ? '貸出対象外になりました。返却をお願いします'
        : a.kind === 'overdue' ? '返却期限（' + fmtShortDay(a.dueDate) + '）を過ぎています'
        : '返却期限（' + fmtShortDay(a.dueDate) + '）が近づいています';
      return '<button class="notice terr-alert" data-action="openTerr" data-id="' + esc(a.id) + '">' + icon('warn', 18) +
        '<span><b>区域 ' + a.number + (a.name ? ' ' + esc(a.name) : '') + '</b><br>' + msg + '</span></button>';
    }).join('');

    var admin = isAdmin()
      ? '<button class="btn outline block" data-go="admin">' + icon('gear', 18) + 'メンバー管理・招待コード</button>'
      : '';

    var tiles = (featOn('board') ? '<button class="tile link" data-go="board"><div class="label">掲示板</div><div class="num">' + (s.unread.board || 0) + '<span class="small muted" style="font-weight:400"> 件の未読</span></div></button>' : '') +
      (featOn('chat') ? '<button class="tile link" data-go="inbox"><div class="label">メッセージ</div><div class="num">' + (s.chatUnread || 0) + '<span class="small muted" style="font-weight:400"> 件の未読</span></div></button>' : '') +
      (featOn('groups') ? '<button class="tile link" data-go="groups"><div class="label">グループ</div><div class="num">' + (s.groupCount || 0) + '<span class="small muted" style="font-weight:400"> 件に参加</span></div></button>' : '') +
      (featOn('cards') ? soon : '');
    return '<div class="muted">' + esc(u.name) + 'さん、こんにちは' + badges + '</div>' + (featOn('cards') ? terrAlerts : '') +
      (featOn('board') ? '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">' +
        '<div class="section-title">お知らせ</div><button class="linkbtn" data-action="toNotices">すべて見る</button></div>' +
        notices + '</div>' : '') +
      (featOn('calendar') ? '<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">' +
        '<div class="section-title">これからの予定（7日間）</div><button class="linkbtn" data-go="calendar">カレンダー</button></div>' +
        upcoming + '</div>' : '') +
      (tiles ? '<div class="tiles">' + tiles + '</div>' : '') + admin;
  }

  function loadSummary() {
    if (!state.token) return Promise.resolve();
    return call('api_homeSummary', state.token, todayStr()).then(function (s) {
      state.summary = s;
      cache.set('summary', s);
      // 入力中の内容を消さないよう、ホームと一覧だけ再描画
      if (state.screen === 'home' || state.screen === 'board') render();
    }, handleError);
  }

  // ---------- 掲示板 ----------
  function boardRight() {
    if (state.boardTab === 'notice' && !isAdmin()) return '';
    if (state.boardTab === 'groups' && !(state.boardGroups || []).length) return '';
    return '<button class="pill" data-action="newPost">' + icon('plus', 16) + '投稿</button>';
  }

  function viewBoard() {
    var u = state.summary.unread;
    var tab = function (key, label, n) {
      return '<button data-action="boardTab" data-tab="' + key + '" class="' + (state.boardTab === key ? 'on' : '') + '">' +
        label + (n ? ' <span class="badge">' + n + '</span>' : '') + '</button>';
    };
    var html = '<div class="seg seg3">' + tab('board', '全体', u.board) + tab('notice', 'お知らせ', u.notice) + tab('groups', 'グループ', u.group) + '</div>';
    if (state.posts === null) return html + '<div class="muted center">読み込み中…</div>';
    if (!state.posts.length) {
      var empty = state.boardTab === 'notice' ? 'お知らせはまだありません'
        : state.boardTab === 'groups'
          ? ((state.boardGroups || []).length ? 'グループの投稿はまだありません' : '掲示板を使っているグループに参加していません')
          : 'まだ投稿がありません。右上の「投稿」から書き込めます';
      return html + '<div class="empty">' + empty + '</div>';
    }
    return html + state.posts.map(postCard).join('');
  }

  function postCard(p) {
    return '<button class="card post-card" data-action="openPost" data-id="' + esc(p.id) + '">' +
      '<div class="post-meta">' + (p.important ? '<span class="tag imp">重要</span>' : '') +
        (p.groupName && state.screen === 'board' ? '<span class="tag grp">' + esc(p.groupName) + '</span>' : '') +
        '<span>' + esc(p.authorName) + '</span><span>' + fmtDate(p.createdAt) + '</span>' +
        (p.isRead ? '' : '<span class="dot" aria-label="未読"></span>') + '</div>' +
      '<div class="post-title">' + esc(p.title) + '</div>' +
      '<div class="post-excerpt">' + esc(p.body) + '</div>' +
      '<div class="post-foot"><span>コメント ' + p.commentCount + '</span><span>既読 ' + p.readCount + '人</span>' +
        (p.files && p.files.length ? '<span>添付 ' + p.files.length + '</span>' : '') + '</div>' +
    '</button>';
  }

  function loadPosts() {
    var tab = state.boardTab;
    // 前回の一覧があればすぐ表示し、裏で最新に更新する
    state.posts = cache.get('posts:' + tab);
    if (!state.boardGroups) state.boardGroups = cache.get('boardGroups');
    render();
    return call('api_listPosts', state.token, tab).then(function (res) {
      if (state.boardTab !== tab) return;
      state.posts = res.posts;
      state.summary.unread = res.unread;
      state.boardGroups = res.boardGroups || [];
      cache.set('posts:' + tab, res.posts);
      cache.set('boardGroups', state.boardGroups);
      if (state.screen === 'board') render();
    }, handleError);
  }

  function findPost(id) {
    var list = (state.posts || []).concat(state.groupPosts || []);
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  // 投稿の画面がグループのものかどうかで、見出し・戻る先を変える
  function postGroupId() {
    if (state.screen === 'compose' && state.compose) return state.compose.groupId || (state.compose.post && state.compose.post.groupId) || '';
    return state.current && state.current.post ? (state.current.post.groupId || '') : '';
  }
  function postTitle() {
    if (!state.current) return '投稿';
    var p = state.current.post;
    if (p.groupId) return p.groupName || (state.group && state.group.group.id === p.groupId ? state.group.group.name : 'グループの投稿');
    return p.type === 'notice' ? 'お知らせ' : '掲示板';
  }
  // 掲示板タブから開いたか、グループ画面から開いたかで戻る先を決める
  function postNav() { return postGroupId() && state.postFrom === 'group' ? 'menu' : 'board'; }
  function postBackTarget() { return postGroupId() && state.postFrom === 'group' ? 'group' : 'board'; }

  function openPost(id) {
    // 一覧にある内容を先に表示し、コメントと既読は読み込み後に表示する
    var known = findPost(id);
    if (state.screen === 'group' || state.screen === 'board') state.postFrom = state.screen;
    state.current = known ? { post: known, comments: null } : null;
    state.commentFiles = [];
    state.screen = 'post';
    render();
    window.scrollTo(0, 0);
    return call('api_getPost', state.token, id).then(function (r) {
      state.current = r;
      state.summary.unread = r.unread;
      if (state.screen === 'post') renderKeepingInput('cm-body');
    }, function (e) {
      handleError(e);
      if (state.token) go(postBackTarget());
    });
  }

  function viewPost() {
    if (!state.current) return '<div class="muted center">読み込み中…</div>';
    var p = state.current.post;
    var actions = '';
    if (p.canEdit) actions += '<button class="btn small outline" data-action="editPost">編集</button>';
    if (p.canDelete) actions += '<button class="btn small danger" data-action="deletePost">削除</button>';

    var loadingComments = state.current.comments === null;
    var commentCount = loadingComments ? p.commentCount : state.current.comments.length;
    var comments = (state.current.comments || []).map(function (c) {
      return '<div class="comment"><div class="avatar">' + esc((c.authorName || '?').slice(0, 1)) + '</div>' +
        '<div style="flex:1;min-width:0"><div class="post-meta"><span style="color:var(--text);font-weight:500">' + esc(c.authorName) + '</span><span>' + fmtDate(c.createdAt) + '</span></div>' +
        (c.body ? '<div class="comment-body">' + richText(c.body) + '</div>' : '') +
        filesView(c.files) + '</div>' +
        (c.canDelete ? '<button class="linkbtn small" data-action="deleteComment" data-id="' + esc(c.id) + '" aria-label="コメントを削除">削除</button>' : '') +
      '</div>';
    }).join('');

    return '<article class="card stack">' +
        '<div class="post-meta">' + (p.important ? '<span class="tag imp">重要</span>' : '') +
          '<span>' + esc(p.authorName) + '</span><span>' + fmtDate(p.createdAt) + (p.edited ? '（編集済み）' : '') + '</span></div>' +
        '<h2 style="font-size:18px">' + esc(p.title) + '</h2>' +
        '<div class="post-body">' + richText(p.body) + '</div>' +
        filesView(p.files) +
        '<div class="post-foot"><span>既読 ' + p.readCount + '人</span><span>コメント ' + commentCount + '</span></div>' +
        (actions ? '<div class="actions">' + actions + '</div>' : '') +
      '</article>' +
      '<section class="card">' +
        '<div class="section-title">コメント</div>' +
        (loadingComments
          ? '<div class="muted small" style="padding:8px 0">読み込み中…</div>'
          : (comments || '<div class="muted small" style="padding:8px 0">まだコメントはありません</div>')) +
        '<form class="stack" data-form="comment" style="padding-top:12px">' +
          '<label for="cm-body" class="small" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">コメント</label>' +
          '<textarea id="cm-body" name="body" maxlength="1000" placeholder="コメントを書く"></textarea>' +
          attachPicker('comment', state.commentFiles) +
          '<button class="btn primary block" type="submit">コメントする</button>' +
        '</form>' +
      '</section>';
  }

  function composeTitle() {
    if (!state.compose) return '投稿';
    var kind = state.compose.pickGroup || state.compose.groupId || (state.compose.post && state.compose.post.groupId) ? 'グループ掲示板' : (state.compose.type === 'notice' ? 'お知らせ' : '掲示板');
    return state.compose.mode === 'edit' ? kind + 'を編集' : kind + 'に投稿';
  }

  function viewCompose() {
    var c = state.compose;
    if (!c) return '';
    var p = c.post || { title: '', body: '', important: false };
    var notice = c.type === 'notice';
    var opts = '';
    if (notice) {
      opts += '<label class="check"><input type="checkbox" name="important"' + (p.important ? ' checked' : '') + '>重要なお知らせにする</label>';
      if (c.mode === 'new') {
        opts += '<label class="check"><input type="checkbox" name="sendMail">メールでも送る</label>' +
          '<div class="hint muted small">メールアドレスを登録しているメンバー全員に送ります。1日の送信数に上限があるため、大切なお知らせだけにしてください。</div>';
      }
    }
    var target = '';
    if (c.mode === 'new' && c.pickGroup) {
      target = '<div class="field"><label for="ps-group">投稿先のグループ</label><select id="ps-group" name="group">' +
        (state.boardGroups || []).map(function (g) { return '<option value="' + esc(g.id) + '">' + esc(g.name) + '</option>'; }).join('') +
        '</select></div>';
    }
    return '<form class="card stack" data-form="post">' + target +
      '<div class="field"><label for="ps-title">タイトル</label><input id="ps-title" name="title" type="text" maxlength="60" value="' + esc(p.title) + '" required></div>' +
      '<div class="field"><label for="ps-body">本文</label><textarea id="ps-body" name="body" maxlength="3000" style="min-height:200px" required>' + esc(p.body) + '</textarea><div class="hint">3000文字まで。URLは自動でリンクになります</div></div>' +
      '<div class="field"><label>添付ファイル</label>' + attachPicker('compose', c.files) + '</div>' +
      opts +
      '<button class="btn primary block" type="submit">' + (c.mode === 'edit' ? '保存する' : '投稿する') + '</button>' +
    '</form>';
  }

  // ---------- カレンダー ----------
  var WD = '日月火水木金土';
  function pad(n) { return ('0' + n).slice(-2); }
  function ymd(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }   // m は0始まり
  function dateToYmd(d) { return ymd(d.getFullYear(), d.getMonth(), d.getDate()); }
  function todayStr() { return dateToYmd(new Date()); }
  function parseYmd(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtYmdJa(s) { var d = parseYmd(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）'; }
  function timeText(e) { return e.allDay ? '終日' : e.startTime + (e.endTime ? '〜' + e.endTime : ''); }
  function canEditCal() { return !!(state.user && (state.user.role === 'admin' || state.user.calendarEditor)); }
  // 予定を追加できる先（全体／グループ）。サーバーから受け取った一覧を使う
  function calTargets() {
    var c = state.cal;
    if (c && c.targets) return c.targets;
    return cache.get('calTargets') || (canEditCal() ? [{ id: '', name: '全体' }] : []);
  }
  function eventFormBack() {
    var f = state.eventForm;
    if (!f) return 'calendar';
    if (f.mode !== 'new') return 'event';
    return f.fromGroup ? 'group' : 'calendar';
  }

  function monthLabels(dateStr) {
    var d = parseYmd(dateStr);
    var n = Math.ceil(d.getDate() / 7);
    return {
      date: '毎月' + d.getDate() + '日',
      nth: '毎月 ' + (n >= 5 ? '最終' : '第' + n) + WD[d.getDay()] + '曜'
    };
  }

  function ensureCal() {
    if (!state.cal) {
      var t = new Date();
      state.cal = { y: t.getFullYear(), m: t.getMonth(), sel: todayStr(), events: null, canEdit: false };
    }
    return state.cal;
  }

  // 月表示（6週間＝42日）の最初と最後の日
  function calRange() {
    var c = ensureCal();
    var first = new Date(c.y, c.m, 1);
    var start = new Date(c.y, c.m, 1 - first.getDay());
    var end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 41);
    return [dateToYmd(start), dateToYmd(end)];
  }

  function loadCalendar() {
    var r = calRange();
    state.cal.events = cache.get('cal:' + r[0]);
    render();
    return call('api_listEvents', state.token, r[0], r[1]).then(function (res) {
      if (calRange()[0] !== r[0]) return;   // 読み込み中に月が変わった
      state.cal.events = res.events;
      state.cal.canEdit = res.canEdit;
      state.cal.targets = res.targets || [];
      cache.set('calTargets', state.cal.targets);
      cache.set('cal:' + r[0], res.events);
      if (state.screen === 'calendar') render();
    }, handleError);
  }

  function moveMonth(k) {
    var c = ensureCal();
    var d = new Date(c.y, c.m + k, 1);
    c.y = d.getFullYear();
    c.m = d.getMonth();
    var sel = parseYmd(c.sel);
    if (sel.getFullYear() !== c.y || sel.getMonth() !== c.m) c.sel = ymd(c.y, c.m, 1);
    loadCalendar();
  }

  function eventRow(e) {
    eventIndex[e.id + '|' + e.date] = e;
    return '<button class="ev-row" data-action="openEvent" data-key="' + esc(e.id + '|' + e.date) + '">' +
      '<span class="ev-bar"></span>' +
      '<span class="ev-main">' +
        '<span class="ev-time">' + (state.screen === 'home' ? fmtYmdJa(e.date) + ' ・ ' : '') + esc(timeText(e)) + '</span>' +
        '<span class="ev-title">' + esc(e.title) + (e.repeat !== 'none' ? ' <span class="ev-rep" aria-label="繰り返し">' + icon('repeat', 13) + '</span>' : '') + '</span>' +
        (e.groupName ? '<span class="ev-group">' + esc(e.groupName) + '</span>' : '') +
        (e.location ? '<span class="ev-loc">' + icon('pin', 13) + esc(e.location) + '</span>' : '') +
      '</span>' +
    '</button>';
  }

  function viewCalendar() {
    var c = ensureCal();
    var r = calRange();
    var start = parseYmd(r[0]);
    var today = todayStr();
    var byDate = {};
    (c.events || []).forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });

    var head = WD.split('').map(function (w, i) {
      return '<span class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</span>';
    }).join('');

    var cells = '';
    for (var i = 0; i < 42; i++) {
      var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var s = dateToYmd(d);
      var cls = ['cal-day'];
      if (d.getMonth() !== c.m) cls.push('out');
      if (s === c.sel) cls.push('sel');
      if (s === today) cls.push('today');
      if (d.getDay() === 0) cls.push('sun');
      if (d.getDay() === 6) cls.push('sat');
      var n = (byDate[s] || []).length;
      cells += '<button class="' + cls.join(' ') + '" data-action="calPick" data-date="' + s + '" aria-label="' + fmtYmdJa(s) + (n ? ' 予定' + n + '件' : '') + '">' +
        '<span class="num">' + d.getDate() + '</span>' +
        '<span class="dots">' + (n ? '<i></i>' : '') + (n > 1 ? '<i></i>' : '') + (n > 2 ? '<i></i>' : '') + '</span></button>';
    }

    var list;
    if (c.events === null) list = '<div class="muted center small">読み込み中…</div>';
    else if ((byDate[c.sel] || []).length) list = byDate[c.sel].map(eventRow).join('');
    else list = '<div class="empty">予定はありません' + (calTargets().length ? '<div style="margin-top:10px"><button class="btn small outline" data-action="newEvent">この日に予定を追加</button></div>' : '') + '</div>';

    return '<div class="card cal">' +
        '<div class="cal-head">' +
          '<button class="iconbtn" data-action="calMove" data-d="-1" aria-label="前の月">' + icon('back', 20) + '</button>' +
          '<div class="cal-title">' + c.y + '年 ' + (c.m + 1) + '月</div>' +
          '<button class="iconbtn" data-action="calMove" data-d="1" aria-label="次の月">' + icon('next', 20) + '</button>' +
          '<button class="btn small outline cal-today" data-action="calToday">今日</button>' +
        '</div>' +
        '<div class="cal-week">' + head + '</div>' +
        '<div class="cal-grid">' + cells + '</div>' +
      '</div>' +
      '<section class="stack" style="gap:10px">' +
        '<div class="section-title">' + fmtYmdJa(c.sel) + 'の予定</div>' + list +
      '</section>';
  }

  function viewEvent() {
    var e = state.eventView;
    if (!e) return '<div class="muted center">予定が見つかりません</div>';
    var rows = '<div class="ev-detail-row">' + icon('cal', 18) + '<span>' + fmtYmdJa(e.date) + '　' + esc(timeText(e)) + '</span></div>';
    if (e.repeatLabel) rows += '<div class="ev-detail-row">' + icon('repeat', 18) + '<span>' + esc(e.repeatLabel) + '</span></div>';
    if (e.location) rows += '<div class="ev-detail-row">' + icon('pin', 18) + '<span>' + esc(e.location) + '</span></div>';
    rows += '<div class="ev-detail-row">' + icon('group', 18) + '<span>' + (e.groupName ? esc(e.groupName) + 'の予定' : '全体の予定') + '</span></div>';
    var actions = e.canEdit
      ? '<div class="actions"><button class="btn small outline" data-action="editEvent">編集</button><button class="btn small danger" data-action="deleteEvent">削除</button></div>'
      : '';
    return '<article class="card stack">' +
      '<h2 style="font-size:19px">' + esc(e.title) + '</h2>' +
      '<div class="stack" style="gap:8px">' + rows + '</div>' +
      (e.memo ? '<div class="post-body" style="padding-top:10px;border-top:1px solid var(--line-soft)">' + richText(e.memo) + '</div>' : '') +
      actions +
    '</article>';
  }

  function eventFormTitle() {
    var f = state.eventForm;
    if (!f) return '予定';
    if (f.mode === 'new') return '予定を追加';
    if (f.mode === 'single') return 'この日の予定を変更';
    if (f.mode === 'future') return 'この日以降を変更';
    return '予定を変更';
  }

  function viewEventForm() {
    var f = state.eventForm;
    if (!f) return '';
    var e = f.ev || {};
    var single = f.mode === 'single';
    var date = f.mode === 'all' ? e.startDate : f.date;
    var repeat = single ? 'none' : (e.repeat || 'none');
    var allDay = !!e.allDay;
    var wds = (e.weekdays && e.weekdays.length) ? e.weekdays : [parseYmd(date).getDay()];
    var ml = monthLabels(date);

    var note = '';
    if (f.mode === 'single') note = '<div class="notice small">繰り返しのうち、' + fmtYmdJa(f.date) + 'の回だけを変更します。</div>';
    if (f.mode === 'future') note = '<div class="notice small">' + fmtYmdJa(f.date) + '以降の回をすべて変更します。それより前の回はそのままです。</div>';
    if (f.mode === 'all' && e.repeat !== 'none') note = '<div class="notice small">繰り返しのすべての回を変更します。</div>';

    var opt = function (v, label) { return '<option value="' + v + '"' + (repeat === v ? ' selected' : '') + '>' + label + '</option>'; };
    var repeatHtml = single ? '' :
      '<div class="field"><label for="ev-repeat">繰り返し</label>' +
        '<select id="ev-repeat" name="repeat" data-change="evRepeat">' +
          opt('none', 'なし') + opt('daily', '毎日') + opt('weekly', '毎週') +
          '<option value="monthly_date" id="ev-opt-md"' + (repeat === 'monthly_date' ? ' selected' : '') + '>' + ml.date + '</option>' +
          '<option value="monthly_nth" id="ev-opt-mn"' + (repeat === 'monthly_nth' ? ' selected' : '') + '>' + ml.nth + '</option>' +
        '</select></div>' +
      '<div class="field" id="ev-weekly"' + (repeat === 'weekly' ? '' : ' hidden') + '><label>曜日</label><div class="wd-pick">' +
        WD.split('').map(function (w, i) {
          return '<label class="wd"><input type="checkbox" name="wd" value="' + i + '"' + (wds.indexOf(i) >= 0 ? ' checked' : '') + '><span>' + w + '</span></label>';
        }).join('') + '</div></div>' +
      '<div class="field" id="ev-until"' + (repeat === 'none' ? ' hidden' : '') + '><label for="ev-until-in">繰り返しの終了日（任意）</label>' +
        '<input id="ev-until-in" name="until" type="date" value="' + esc(e.untilDate || '') + '"><div class="hint">空欄の場合はずっと繰り返します</div></div>';

    // 追加先（新規のときだけ選べる。グループから開いた場合は固定）
    var targetHtml = '';
    if (f.mode === 'new' && !f.fromGroup) {
      var targets = calTargets();
      if (targets.length > 1) {
        targetHtml = '<div class="field"><label for="ev-target">追加先</label><select id="ev-target" name="target">' +
          targets.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('') + '</select></div>';
      } else if (targets.length === 1) {
        targetHtml = '<input type="hidden" name="target" value="' + esc(targets[0].id) + '">' +
          '<div class="muted small">追加先：' + esc(targets[0].name) + '</div>';
      }
    } else if (f.mode === 'new' && f.fromGroup && state.group) {
      targetHtml = '<div class="muted small">追加先：' + esc(state.group.group.name) + '</div>';
    }

    return note + '<form class="card stack" data-form="event">' + targetHtml +
      '<div class="field"><label for="ev-title">タイトル</label><input id="ev-title" name="title" type="text" maxlength="60" value="' + esc(e.title || '') + '" required></div>' +
      '<div class="field"><label for="ev-date">' + (repeat !== 'none' || f.mode === 'new' ? '日付（繰り返しの場合は開始日）' : '日付') + '</label>' +
        '<input id="ev-date" name="date" type="date" value="' + esc(date) + '" data-change="evDate" required></div>' +
      '<label class="check"><input type="checkbox" name="allDay" data-change="evAllDay"' + (allDay ? ' checked' : '') + '>終日</label>' +
      '<div class="time-row" id="ev-times"' + (allDay ? ' hidden' : '') + '>' +
        '<div class="field"><label for="ev-st">開始</label><input id="ev-st" name="startTime" type="time" value="' + esc(e.startTime || '10:00') + '"></div>' +
        '<span class="muted">〜</span>' +
        '<div class="field"><label for="ev-et">終了（任意）</label><input id="ev-et" name="endTime" type="time" value="' + esc(e.endTime || '') + '"></div>' +
      '</div>' +
      '<div class="field"><label for="ev-loc">場所（任意）</label><input id="ev-loc" name="location" type="text" maxlength="60" value="' + esc(e.location || '') + '"></div>' +
      '<div class="field"><label for="ev-memo">メモ（任意）</label><textarea id="ev-memo" name="memo" maxlength="1000">' + esc(e.memo || '') + '</textarea></div>' +
      repeatHtml +
      '<button class="btn primary block" type="submit">保存する</button>' +
    '</form>';
  }

  function openEventForm(mode, e, date, groupId) {
    state.eventForm = { mode: mode, ev: e, date: date, groupId: groupId || '', fromGroup: !!groupId };
    go('eventForm');
  }

  // ダイアログで選択肢を選ぶ（キャンセルは null）
  var chooseResolve = null;
  function choose(msg, opts) {
    return new Promise(function (resolve) {
      chooseResolve = resolve;
      var d = document.getElementById('dlg');
      if (!d) {
        d = document.createElement('div');
        d.id = 'dlg';
        d.className = 'dialog';
        document.body.appendChild(d);
      }
      d.innerHTML = '<div class="dialog-box" role="dialog" aria-modal="true" aria-label="' + esc(msg) + '">' +
        '<div class="dialog-msg' + (msg.indexOf('・') >= 0 ? ' left' : '') + '">' + esc(msg) + '</div>' +
        opts.map(function (o) {
          return '<button class="btn ' + (o[2] || 'outline') + ' block" data-action="choose" data-key="' + o[0] + '">' + esc(o[1]) + '</button>';
        }).join('') +
        '<button class="linkbtn" data-action="choose" data-key="">キャンセル</button></div>';
      d.hidden = false;
    });
  }
  function closeChoose(key) {
    var d = document.getElementById('dlg');
    if (d) d.hidden = true;
    var r = chooseResolve;
    chooseResolve = null;
    if (r) r(key || null);
  }

  var REPEAT_SCOPES = [['single', 'この日だけ'], ['future', 'この日以降すべて'], ['all', 'すべての回']];

  // ---------- メニュー ----------
  function viewMenu() {
    var item = function (go, ic, label, sub) {
      return '<button class="menu-item" data-go="' + go + '">' + icon(ic) +
        '<span class="menu-text"><span class="menu-label">' + label + '</span>' + (sub ? '<span class="muted small">' + sub + '</span>' : '') + '</span>' +
        icon('next', 18) + '</button>';
    };
    return '<div class="card menu-list">' +
      (featOn('groups') ? item('groups', 'group', 'グループ', (state.summary.groupCount || 0) + 'グループに参加中') : '') +
      item('account', 'user', 'アカウント', 'プロフィール・パスワード・ログアウト') +
      (isAdmin() ? item('admin', 'gear', 'メンバー管理', '招待コード・権限・アプリの設定') : '') +
    '</div>';
  }

  // ---------- グループ ----------
  var FEATURE_LABELS = { board: '掲示板', calendar: 'カレンダー', chat: 'チャット' };
  function hasFeature(g, f) { return featOn(f) && g && g.features && g.features.indexOf(f) >= 0; }

  function loadGroups() {
    state.groups = state.groups || cache.get('groups');
    render();
    return call('api_listGroups', state.token).then(function (list) {
      state.groups = list;
      cache.set('groups', list);
      if (state.screen === 'groups') render();
    }, handleError);
  }

  function viewGroups() {
    if (!state.groups) return '<div class="muted center">読み込み中…</div>';
    if (!state.groups.length) {
      return '<div class="empty">まだグループに参加していません。<br>右上の「作成」から、LINEのグループのように作れます。</div>';
    }
    return state.groups.map(function (g) {
      var unread = (g.boardUnread || 0) + (g.chatUnread || 0);
      return '<button class="card group-row" data-action="openGroup" data-id="' + esc(g.id) + '">' +
        '<span class="group-icon">' + esc(g.name.slice(0, 1)) + '</span>' +
        '<span class="group-main"><span class="group-name">' + esc(g.name) + (g.isLeader ? ' <span class="tag admin">責任者</span>' : '') + '</span>' +
        '<span class="muted small">' + g.memberCount + '人 ・ ' + (g.features.map(function (f) { return FEATURE_LABELS[f]; }).join('・') || '機能なし') + '</span></span>' +
        (unread ? '<span class="badge">' + unread + '</span>' : '') +
      '</button>';
    }).join('');
  }

  function openGroup(id) {
    var known = (state.groups || []).filter(function (g) { return g.id === id; })[0];
    state.group = known ? { group: known, members: null } : null;
    state.groupPosts = null;
    state.groupEvents = null;
    state.groupTab = known && known.features.length ? known.features[0] : 'members';
    state.groupId = id;
    go('group');
  }

  function loadGroup() {
    var id = state.groupId;
    render();
    return call('api_getGroup', state.token, id).then(function (r) {
      if (state.groupId !== id) return;
      var keepTab = state.group && state.group.members !== null;
      // 未読数は一覧から引き継ぐ
      var known = (state.groups || []).filter(function (g) { return g.id === id; })[0];
      r.group.boardUnread = known ? known.boardUnread : 0;
      r.group.chatUnread = known ? known.chatUnread : 0;
      state.group = r;
      if (!keepTab && r.group.features.indexOf(state.groupTab) < 0 && state.groupTab !== 'members') {
        state.groupTab = r.group.features[0] || 'members';
      }
      if (state.screen === 'group') render();
      loadGroupTab();
    }, function (e) {
      handleError(e);
      if (state.token) go('groups');
    });
  }

  function loadGroupTab() {
    var g = state.group && state.group.group;
    if (!g) return;
    if (state.groupTab === 'board' && hasFeature(g, 'board')) {
      call('api_listPosts', state.token, 'board', g.id).then(function (res) {
        if (!state.group || state.group.group.id !== g.id) return;
        state.groupPosts = res.posts;
        if (state.screen === 'group') render();
      }, handleError);
    }
    if (state.groupTab === 'calendar' && hasFeature(g, 'calendar')) {
      var today = todayStr();
      var end = dateToYmd(new Date(parseYmd(today).getTime() + 60 * 86400000));
      call('api_listEvents', state.token, today, end, g.id).then(function (res) {
        if (!state.group || state.group.group.id !== g.id) return;
        state.groupEvents = res.events;
        if (state.screen === 'group') render();
      }, handleError);
    }
  }

  function viewGroup() {
    if (!state.group) return '<div class="muted center">読み込み中…</div>';
    var g = state.group.group;
    var tabs = g.features.map(function (f) { return [f, FEATURE_LABELS[f]]; }).concat([['members', 'メンバー']]);
    var tabHtml = '<div class="tabs" role="tablist">' + tabs.map(function (t) {
      var n = t[0] === 'board' ? (g.boardUnread || 0) : t[0] === 'chat' ? (g.chatUnread || 0) : 0;
      return '<button role="tab" aria-selected="' + (state.groupTab === t[0]) + '" class="' + (state.groupTab === t[0] ? 'on' : '') + '" data-action="groupTab" data-tab="' + t[0] + '">' +
        t[1] + (n ? ' <span class="badge">' + n + '</span>' : '') + '</button>';
    }).join('') + '</div>';
    var desc = g.description ? '<div class="muted small group-desc">' + esc(g.description) + '</div>' : '';
    var body;
    switch (state.groupTab) {
      case 'board': body = viewGroupBoard(); break;
      case 'calendar': body = viewGroupCalendar(); break;
      case 'chat': body = viewGroupChat(); break;
      default: body = viewGroupMembers();
    }
    return desc + tabHtml + body;
  }

  function viewGroupBoard() {
    var head = '<div class="row-end"><button class="btn small primary" data-action="newGroupPost">' + icon('plus', 16) + '投稿</button></div>';
    if (state.groupPosts === null) return head + '<div class="muted center small">読み込み中…</div>';
    if (!state.groupPosts.length) return head + '<div class="empty">まだ投稿がありません</div>';
    return head + state.groupPosts.map(postCard).join('');
  }

  function viewGroupCalendar() {
    var head = '<div class="row-end"><button class="btn small primary" data-action="newGroupEvent">' + icon('plus', 16) + '予定を追加</button></div>';
    if (state.groupEvents === null) return head + '<div class="muted center small">読み込み中…</div>';
    if (!state.groupEvents.length) return head + '<div class="empty">これから60日間の予定はありません</div>';
    return head + '<div class="card">' + state.groupEvents.map(function (e) {
      eventIndex[e.id + '|' + e.date] = e;
      return '<button class="ev-row" data-action="openEvent" data-key="' + esc(e.id + '|' + e.date) + '">' +
        '<span class="ev-bar"></span><span class="ev-main">' +
        '<span class="ev-time">' + fmtYmdJa(e.date) + ' ・ ' + esc(timeText(e)) + '</span>' +
        '<span class="ev-title">' + esc(e.title) + '</span>' +
        (e.location ? '<span class="ev-loc">' + icon('pin', 13) + esc(e.location) + '</span>' : '') +
        '</span></button>';
    }).join('') + '</div>';
  }

  function viewGroupChat() {
    var g = state.group.group;
    return '<div class="card stack center">' +
      '<div>' + icon('chat', 32) + '</div>' +
      '<div>グループのメンバー全員でやり取りできます</div>' +
      '<button class="btn primary block" data-action="openChat" data-id="g_' + esc(g.id) + '">チャットを開く' +
        (g.chatUnread ? '（未読 ' + g.chatUnread + '）' : '') + '</button></div>';
  }

  function viewGroupMembers() {
    var g = state.group.group;
    var members = state.group.members;
    if (!members) return '<div class="muted center small">読み込み中…</div>';
    var list = members.map(function (m) {
      var ctrl = '';
      if (g.isLeader && !m.isMe) {
        ctrl = '<div class="member-actions">' +
          (m.role === 'leader'
            ? '<button class="btn small outline" data-action="setGroupRole" data-id="' + esc(m.id) + '" data-role="member">責任者から外す</button>'
            : '<button class="btn small outline" data-action="setGroupRole" data-id="' + esc(m.id) + '" data-role="leader">責任者にする</button>') +
          '<button class="btn small danger" data-action="removeGroupMember" data-id="' + esc(m.id) + '">外す</button></div>';
      }
      return '<div class="gm-row"><div class="avatar">' + esc((m.name || '?').slice(0, 1)) + '</div>' +
        '<div class="gm-main"><div class="member-name">' + esc(m.name) + (m.isMe ? '（あなた）' : '') +
        (m.role === 'leader' ? ' <span class="tag admin">責任者</span>' : '') + (m.active ? '' : ' <span class="tag off">利用停止中</span>') + '</div>' + ctrl + '</div></div>';
    }).join('');
    var leaderTools = g.isLeader
      ? '<div class="actions"><button class="btn small primary" data-action="addGroupMembers">' + icon('plus', 16) + 'メンバーを追加</button>' +
        '<button class="btn small outline" data-action="editGroup">' + icon('gear', 16) + 'グループの設定</button></div>'
      : '';
    return leaderTools + '<div class="card">' + list + '</div>' +
      '<button class="btn danger block" data-action="leaveGroup">このグループから抜ける</button>' +
      (g.isLeader ? '<button class="linkbtn danger-text" data-action="deleteGroup">グループを削除する</button>' : '');
  }

  function viewGroupForm() {
    var f = state.groupForm;
    if (!f) return '';
    var g = f.group || { name: '', description: '', features: ['board', 'calendar', 'chat'] };
    var feats = ['board', 'calendar', 'chat'].map(function (k) {
      return '<label class="check"><input type="checkbox" name="feature" value="' + k + '"' + (g.features.indexOf(k) >= 0 ? ' checked' : '') + '>' + FEATURE_LABELS[k] + '</label>';
    }).join('');
    var members = '';
    if (f.mode === 'new') {
      members = '<div class="field"><label>メンバー（あとから追加もできます）</label>' + userChecklist(f.selected) + '</div>';
    }
    return '<form class="card stack" data-form="group">' +
      '<div class="field"><label for="gf-name">グループ名</label><input id="gf-name" name="name" type="text" maxlength="30" value="' + esc(g.name) + '" required></div>' +
      '<div class="field"><label for="gf-desc">説明（任意）</label><textarea id="gf-desc" name="description" maxlength="200">' + esc(g.description) + '</textarea></div>' +
      '<div class="field"><label>使う機能</label>' + feats + '<div class="hint muted small">オフにした機能は、メンバーの画面に表示されません</div></div>' +
      members +
      '<button class="btn primary block" type="submit">' + (f.mode === 'new' ? '作成する' : '保存する') + '</button>' +
    '</form>';
  }

  // メンバー選択（チェックボックス＋名前で絞り込み）
  function userChecklist(selected, exclude) {
    if (!state.users) return '<div class="muted small">読み込み中…</div>';
    exclude = exclude || {};
    var list = state.users.filter(function (u) { return !u.isMe && !exclude[u.id]; });
    if (!list.length) return '<div class="muted small">追加できるメンバーがいません</div>';
    return '<input type="text" class="user-filter" data-filter="users" placeholder="名前で絞り込み" aria-label="名前で絞り込み">' +
      '<div class="user-list">' + list.map(function (u) {
        return '<label class="check user-item" data-name="' + esc(u.name) + '"><input type="checkbox" name="member" value="' + esc(u.id) + '"' + (selected && selected[u.id] ? ' checked' : '') + '>' + esc(u.name) + '</label>';
      }).join('') + '</div>';
  }

  function loadUsers() {
    if (state.users) return Promise.resolve(state.users);
    return call('api_listUsers', state.token).then(function (list) {
      state.users = list;
      if (state.screen === 'groupForm' || state.screen === 'pickUsers') render();
      return list;
    }, handleError);
  }

  // ---------- メンバー選択画面（1対1の相手／グループへの追加） ----------
  function viewPicker() {
    var p = state.picker;
    if (!p) return '';
    if (p.mode === 'dm') {
      if (!state.users) return '<div class="muted center">読み込み中…</div>';
      var list = state.users.filter(function (u) { return !u.isMe; });
      return '<input type="text" class="user-filter" data-filter="users" placeholder="名前で絞り込み" aria-label="名前で絞り込み">' +
        '<div class="card user-list">' + list.map(function (u) {
          return '<button class="user-item user-pick" data-name="' + esc(u.name) + '" data-action="startDm" data-id="' + esc(u.id) + '">' +
            '<span class="avatar">' + esc(u.name.slice(0, 1)) + '</span>' + esc(u.name) + '</button>';
        }).join('') + '</div>';
    }
    var exclude = {};
    (state.group && state.group.members || []).forEach(function (m) { exclude[m.id] = true; });
    return '<form class="card stack" data-form="addMembers">' + userChecklist({}, exclude) +
      '<button class="btn primary block" type="submit">追加する</button></form>';
  }

  // ---------- メッセージ ----------
  function loadInbox() {
    state.inbox = state.inbox || cache.get('inbox');
    render();
    return refreshInbox();
  }
  function refreshInbox() {
    return call('api_inbox', state.token).then(function (list) {
      state.inbox = list;
      cache.set('inbox', list);
      var total = 0;
      list.forEach(function (c) { total += c.unread; });
      state.summary.chatUnread = total;
      if (state.screen === 'inbox') render();
    }, handleError);
  }

  function fmtChatTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var t = new Date();
    if (d.toDateString() === t.toDateString()) return d.getHours() + ':' + pad(d.getMinutes());
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function viewInbox() {
    if (!state.inbox) return '<div class="muted center">読み込み中…</div>';
    if (!state.inbox.length) {
      return '<div class="empty">まだメッセージはありません。<br>右上の「新規」から、メンバーにメッセージを送れます。</div>';
    }
    return '<div class="card inbox">' + state.inbox.map(function (c) {
      return '<button class="conv-row" data-action="openChat" data-id="' + esc(c.id) + '">' +
        '<span class="avatar' + (c.type === 'group' ? ' group' : '') + '">' + (c.type === 'group' ? icon('group', 18) : esc(c.title.slice(0, 1))) + '</span>' +
        '<span class="conv-main"><span class="conv-top"><span class="conv-title">' + esc(c.title) + '</span><span class="muted small">' + fmtChatTime(c.lastAt) + '</span></span>' +
        '<span class="conv-last muted small">' + esc(c.lastText || 'まだメッセージはありません') + '</span></span>' +
        (c.unread ? '<span class="badge">' + c.unread + '</span>' : '') +
      '</button>';
    }).join('') + '</div>';
  }

  function openChat(convId, back) {
    state.chat = { convId: convId, data: cache.get('chat:' + convId), files: [], sending: false };
    state.chatBack = back || (state.screen === 'group' ? 'group' : 'inbox');
    state.screen = 'chat';
    render();
    scrollChatBottom();
    return call('api_getChat', state.token, convId).then(function (r) {
      if (!state.chat || state.chat.convId !== convId) return;
      applyChat(r, true);
      refreshUnreadSoon();
    }, function (e) {
      handleError(e);
      if (state.token) go(state.chatBack);
    });
  }

  function applyChat(r, forceBottom) {
    var nearBottom = forceBottom || (window.innerHeight + window.scrollY >= document.body.scrollHeight - 120);
    state.chat.data = r;
    cache.set('chat:' + state.chat.convId, r);
    if (state.screen !== 'chat') return;
    var y = window.scrollY;
    renderKeepingInput('msg-body');
    if (nearBottom) scrollChatBottom(); else window.scrollTo(0, y);
  }

  function scrollChatBottom() {
    window.scrollTo(0, document.body.scrollHeight);
  }

  function viewChat() {
    var c = state.chat;
    if (!c) return '';
    var d = c.data;
    var msgs = '';
    if (!d) {
      msgs = '<div class="muted center small">読み込み中…</div>';
    } else if (!d.messages.length) {
      msgs = '<div class="muted center small" style="padding:24px 0">まだメッセージはありません</div>';
    } else {
      var lastDay = '';
      var isGroup = d.conv.type === 'group';
      msgs = (d.hasMore ? '<div class="muted center small">これより前のメッセージは省略しています（最新' + d.messages.length + '件）</div>' : '') +
        d.messages.map(function (m) {
          var day = new Date(m.createdAt).toDateString();
          var sep = '';
          if (day !== lastDay) {
            lastDay = day;
            sep = '<div class="day-sep"><span>' + fmtYmdJa(dateToYmd(new Date(m.createdAt))) + '</span></div>';
          }
          var t = new Date(m.createdAt);
          var time = t.getHours() + ':' + pad(t.getMinutes());
          var body = (m.body ? '<div class="bubble-text">' + richText(m.body) + '</div>' : '') + filesView(m.files) +
            (m.expiredFiles ? '<div class="file-expired">添付ファイル（' + m.expiredFiles + '件）は、保存期間（6か月）を過ぎたため削除されました</div>' : '');
          if (m.mine) {
            var read = m.readCount > 0 ? (isGroup ? '既読 ' + m.readCount : '既読') : '';
            return sep + '<div class="msg mine"><div class="msg-meta">' + (read ? '<span class="read">' + read + '</span>' : '') + '<span>' + time + '</span></div>' +
              '<div class="bubble" data-action="msgMenu" data-id="' + esc(m.id) + '">' + body + '</div></div>';
          }
          return sep + '<div class="msg other"><div class="avatar">' + esc((m.authorName || '?').slice(0, 1)) + '</div>' +
            '<div class="msg-col">' + (isGroup ? '<div class="msg-name">' + esc(m.authorName) + '</div>' : '') +
            '<div class="msg-line"><div class="bubble">' + body + '</div><span class="msg-meta">' + time + '</span></div></div></div>';
        }).join('');
    }
    return '<div class="chat-log">' + msgs + '</div>' +
      '<form class="composer" data-form="chat">' +
        '<div id="att-chat" class="att-list">' + attListHtml(c.files, 'chat') + '</div>' +
        '<div class="composer-row">' +
          '<label class="composer-btn" aria-label="画像・PDFを添付">' + icon('clip', 22) +
            '<input type="file" multiple accept="image/*,application/pdf" data-upload="chat" class="sr-only"></label>' +
          '<label for="msg-body" class="sr-only">メッセージ</label>' +
          '<textarea id="msg-body" name="body" rows="1" maxlength="2000" placeholder="メッセージを入力" data-autogrow="1"></textarea>' +
          '<button type="submit" class="composer-send" aria-label="送信"' + (c.sending ? ' disabled' : '') + '>' + icon('send', 20) + '</button>' +
        '</div>' +
      '</form>';
  }

  // 未読数（下のメニューのバッジ）を少し後に更新
  var unreadTimer = null;
  function refreshUnreadSoon() {
    clearTimeout(unreadTimer);
    unreadTimer = setTimeout(function () {
      if (!state.token) return;
      call('api_homeSummary', state.token, todayStr()).then(function (s) {
        state.summary = s;
        cache.set('summary', s);
        if (SAFE_TO_RENDER.indexOf(state.screen) >= 0) render();
      }, function () {});
    }, 800);
  }

  // 入力欄のない画面だけ、自動更新で書き換える
  var SAFE_TO_RENDER = ['home', 'board', 'inbox', 'menu', 'groups', 'calendar', 'territory'];

  // ---------- 区域カード ----------
  function terrTitle(c) { return (c.type === 'list' ? 'リスト ' : '区域 ') + c.number + (c.name ? ' ' + c.name : ''); }
  function isList(c) { return c.type === 'list'; }
  function notList(c) { return c.type !== 'list'; }

  // リストの1行（借りる・返却はなく、全員がいつでも開ける）
  function listRow(c) {
    return '<div class="terr-row" data-name="' + esc(c.number + ' ' + (c.name || '')) + '">' +
      '<button class="terr-open" data-action="openTerr" data-id="' + esc(c.id) + '">' +
        '<span class="terr-no list">' + esc(c.number) + '</span>' +
        '<span class="terr-main"><span class="terr-name">' + (c.name ? esc(c.name) : 'リスト ' + esc(c.number)) +
          (c.warnCount ? ' <span class="tag imp">要注意 ' + c.warnCount + '</span>' : '') + '</span>' +
          (c.commentCount ? '<span class="muted small">コメント ' + c.commentCount + '件</span>' : '') +
        '</span><span class="chev">' + icon('next', 18) + '</span></button>' +
    '</div>';
  }
  function fmtShortDay(s) { if (!s) return ''; var d = parseYmd(s); return (d.getMonth() + 1) + '/' + d.getDate(); }

  function loadTerritories() {
    state.terr = state.terr || cache.get('terr');
    render();
    return call('api_territories', state.token).then(function (r) {
      state.terr = r;
      cache.set('terr', r);
      if (state.screen === 'territory' || state.screen === 'terrAdmin') renderKeepingInput('terr-search');
    }, handleError);
  }

  function terrStatus(c) {
    if (c.held) {
      var who = c.heldByMe ? 'あなた' : esc(c.holderName);
      var due = c.dueDate ? '（期限 ' + fmtShortDay(c.dueDate) + (c.overdue ? '・超過' : '') + '）' : '';
      return '<span class="' + (c.overdue ? 'st-bad' : 'st-held') + '">' + who + 'が貸出中' + due + '</span>';
    }
    return c.available ? '<span class="st-free">貸出可</span>' : '<span class="muted">貸出対象外</span>';
  }

  function terrRow(c) {
    var last = c.lastUsedDate ? '前回：' + esc(c.lastUserName || '') + '・' + fmtShortDay(c.lastUsedDate) + 'に使用' : (c.lastUserName ? '前回：' + esc(c.lastUserName) : '');
    return '<div class="terr-row" data-name="' + esc(c.number + ' ' + (c.name || '')) + '">' +
      '<button class="terr-open" data-action="openTerr" data-id="' + esc(c.id) + '">' +
        '<span class="terr-no' + (c.needReturn ? ' warn' : '') + '">' + c.number + '</span>' +
        '<span class="terr-main"><span class="terr-name">' + (c.name ? esc(c.name) : '区域 ' + c.number) +
          (c.type === 'list' ? ' <span class="tag soon">リスト</span>' : '') +
          (c.warnCount ? ' <span class="tag imp">要注意 ' + c.warnCount + '</span>' : '') + '</span>' +
        '<span class="small">' + terrStatus(c) + '</span>' +
        (last ? '<span class="muted small">' + last + '</span>' : '') +
        (c.needReturn ? '<span class="small st-warn">' + icon('warn', 14) + '貸出対象外になりました。返却をお願いします</span>' : '') +
        '</span></button>' +
      (c.available && !c.held ? '<button class="btn small primary" data-action="borrowTerr" data-id="' + esc(c.id) + '">借りる</button>' : '') +
    '</div>';
  }

  // 区域番号の扱い（「1-2」→親番号「1」）
  function terrParent(label) { return String(label).split('-')[0]; }
  function terrKey(label) { var p = String(label).split('-'); return [Number(p[0]) || 0, Number(p[1]) || 0]; }
  function normTerrLabel(v) {
    v = String(v || '').trim()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/\s*[_‐－ー−―\-]\s*/g, '-');
    var m = v.match(/^(\d{1,4})(?:-(\d{1,3}))?$/);
    return m ? (m[2] ? Number(m[1]) + '-' + Number(m[2]) : String(Number(m[1]))) : '';
  }

  // 親番号ごとのまとまり（枝番のない1枚だけの番号は、そのまま1行で表示）
  var terrOpen = {};   // 開いている親番号（この端末の表示中だけ覚える）
  function terrGroups(cards, key) {
    var order = [], map = {};
    cards.forEach(function (c) {
      var p = terrParent(c.number);
      if (!map[p]) { map[p] = []; order.push(p); }
      map[p].push(c);
    });
    return order.map(function (p) {
      var list = map[p];
      var single = list.length === 1 && String(list[0].number).indexOf('-') < 0;
      if (single) return terrRow(list[0]);
      var openKey = key + ':' + p;
      var open = !!terrOpen[openKey];
      var avail = list.filter(function (c) { return c.available && !c.held; }).length;
      var held = list.filter(function (c) { return c.held; }).length;
      var warn = list.reduce(function (n, c) { return n + (c.warnCount || 0); }, 0);
      var need = list.some(function (c) { return c.needReturn || c.overdue; });
      var sub = list.length + '枚' + (avail ? '・貸出可 ' + avail : '') + (held ? '・貸出中 ' + held : '');
      return '<div class="terr-group" data-parent="' + esc(p) + '">' +
        '<button class="terr-parent" data-action="toggleParent" data-key="' + esc(openKey) + '" aria-expanded="' + open + '">' +
          '<span class="terr-no' + (need ? ' warn' : '') + '">' + esc(p) + '</span>' +
          '<span class="terr-main"><span class="terr-name">区域 ' + esc(p) + (warn ? ' <span class="tag imp">要注意 ' + warn + '</span>' : '') + '</span>' +
          '<span class="muted small">' + sub + '</span></span>' +
          '<span class="chev">' + icon('next', 18) + '</span></button>' +
        '<div class="terr-children"' + (open ? '' : ' hidden') + '>' + list.map(terrRow).join('') + '</div></div>';
    }).join('');
  }

  function viewTerritory() {
    var t = state.terr;
    if (!t) return '<div class="muted center">読み込み中…</div>';
    var lists = t.cards.filter(isList);
    var cards = t.cards.filter(notList);
    var seg = '';
    if (lists.length) {
      seg = '<div class="seg">' +
        '<button data-action="terrSeg" data-tab="cards" class="' + (state.terrSeg !== 'lists' ? 'on' : '') + '">区域カード</button>' +
        '<button data-action="terrSeg" data-tab="lists" class="' + (state.terrSeg === 'lists' ? 'on' : '') + '">リスト（' + lists.length + '）</button>' +
      '</div>';
      if (state.terrSeg === 'lists') {
        return seg +
          '<input type="text" id="terr-search" class="user-filter" data-filter="terr" placeholder="番号・名前で絞り込み" aria-label="番号・名前で絞り込み">' +
          '<div class="muted small">リストは借りずに、全員がいつでも開いて編集できます。</div>' +
          '<div class="card terr-list">' + lists.map(listRow).join('') + '</div>';
      }
    }
    var mine = cards.filter(function (c) { return c.heldByMe; });
    var avail = cards.filter(function (c) { return c.available && !c.heldByMe; });
    var others = t.isAdmin ? cards.filter(function (c) { return !c.available && !c.heldByMe; }) : [];
    var banner = seg + '<div class="terr-banner"><div><div class="small">今の貸出対象</div><div class="big">' + cards.filter(function (c) { return c.available; }).length + '枚</div></div>' +
      '<div class="right"><div class="small">返却期限</div><div class="big">借りてから' + t.dueDays + '日</div></div></div>';
    var html = banner;
    if (mine.length) html += '<section class="stack" style="gap:8px"><div class="section-title">借りている区域（' + mine.length + '）</div><div class="card terr-list">' + mine.map(terrRow).join('') + '</div></section>';
    html += '<input type="text" id="terr-search" class="user-filter" data-filter="terr" placeholder="番号・名前で絞り込み（例：3-2）" aria-label="番号・名前で絞り込み">';
    html += '<section class="stack" style="gap:8px"><div class="section-title">貸出対象の区域（' + avail.length + '）</div>' +
      (avail.length ? '<div class="card terr-list">' + terrGroups(avail, 'av') + '</div>' : '<div class="empty">今は貸出対象の区域がありません</div>') + '</section>';
    if (others.length) html += '<section class="stack" style="gap:8px"><div class="section-title">貸出対象外（管理者のみ表示・' + others.length + '）</div><div class="card terr-list">' + terrGroups(others, 'ot') + '</div></section>';
    return html;
  }

  function lendTerr(userId, name) {
    var c = state.terrCard;
    return run('api_lendTerritory', state.token, c.id, userId, name).then(function () {
      toast('貸し出しました。');
      openTerr(c.id, state.terrBack);
    });
  }

  function openTerr(id, back) {
    var known = state.terr && state.terr.cards.filter(function (c) { return c.id === id; })[0];
    state.terrCard = known ? JSON.parse(JSON.stringify(known)) : null;
    if (state.terrCard) state.terrCard.loading = true;
    state.terrTab = known && known.type === 'list' ? 'list' : 'map';
    state.terrBack = back || (state.screen === 'terrAdmin' ? 'terrAdmin' : state.screen === 'home' ? 'home' : 'territory');
    mapView.cardId = null;   // 別のカードを開いたら倍率・位置・全画面を初期状態に
    state.screen = 'terrCard';
    render();
    window.scrollTo(0, 0);
    return reloadTerrCard(id);
  }

  function reloadTerrCard(id) {
    return call('api_territory', state.token, id).then(function (r) {
      if (state.screen !== 'terrCard' && state.screen !== 'terrLend' && state.screen !== 'terrHistory' && state.screen !== 'terrEdit') return;
      state.terrCard = r;
      if (state.screen === 'terrCard') renderKeepingInput('tc-body');
    }, function (e) {
      handleError(e);
      if (state.token) go('territory');
    });
  }

  function viewTerrCard() {
    var c = state.terrCard;
    if (!c) return '<div class="muted center">読み込み中…</div>';
    if (isList(c)) return viewListCard(c);
    var info = '<div class="card terr-info">' +
      '<div class="ti-row"><span class="muted">状態</span><span>' + terrStatus(c) + '</span></div>' +
      (c.held && c.borrowedAt ? '<div class="ti-row"><span class="muted">借りた日</span><span>' + fmtDay(c.borrowedAt) + '</span></div>' : '') +
      '<div class="ti-row"><span class="muted">前回の使用</span><span>' + (c.lastUserName ? esc(c.lastUserName) + (c.lastUsedDate ? '・' + fmtYmdJa(c.lastUsedDate) + 'に使用' : '') : 'まだ記録がありません') + '</span></div>' +
    '</div>';
    if (c.needReturn && c.heldByMe) info = '<div class="notice">' + icon('warn', 16) + ' この区域は貸出対象外になりました。返却をお願いします。</div>' + info;

    var actions = '';
    if (c.canBorrow) actions += '<button class="btn primary block" data-action="borrowTerr" data-id="' + esc(c.id) + '">この区域を借りる</button>';
    if (c.canReturn) actions += '<button class="btn primary block" data-action="returnTerr">' + (c.heldByMe ? '返却する' : '代理で返却する') + '</button>';
    if (c.isAdmin) {
      actions += '<div class="actions">' +
        (!c.held ? '<button class="btn small outline" data-action="lendTerr">代理で貸し出す</button>' : '') +
        '<button class="btn small outline" data-action="terrHistory">' + icon('history', 16) + '使用履歴</button>' +
        '<button class="btn small outline" data-action="editTerr">編集</button>' +
      '</div>';
    }

    var tabs = [[c.type === 'list' ? 'list' : 'map', c.type === 'list' ? 'リスト' : '地図'], ['comments', 'コメント' + (c.commentCount ? '（' + c.commentCount + '）' : '')]];
    var tabHtml = '<div class="tabs">' + tabs.map(function (t) {
      return '<button class="' + (state.terrTab === t[0] ? 'on' : '') + '" data-action="terrTab" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';

    var warn = (c.comments || []).filter(function (x) { return x.warn; });
    var warnBox = warn.length ? '<div class="warn-box">' + icon('warn', 16) + '<div>' + warn.map(function (x) { return '<div>' + esc(x.body) + '</div>'; }).join('') + '</div></div>' : '';

    var body;
    if (state.terrTab === 'comments') body = viewTerrComments(c);
    else if (state.terrTab === 'list') body = viewTerrList(c);
    else body = viewTerrMap(c);
    return info + actions + warnBox + tabHtml + body;
  }

  // リスト：表の表示・編集とコメント（借りる・返却はなし）
  function viewListCard(c) {
    var top = '<div class="card stack">' +
      (c.sheetUrl
        ? '<a class="btn outline block" href="' + esc(c.sheetUrl) + '" target="_blank" rel="noopener">' + icon('open', 16) + 'スプレッドシートで開く</a>' +
          '<div class="muted small">スプレッドシートを共有されている人だけが開けます。共有されていない人は、下の表で表示・編集できます。</div>'
        : '<div class="muted small">読み込み中…</div>') +
      (c.isAdmin ? '<div class="actions"><button class="btn small outline" data-action="editTerr">編集</button></div>' : '') +
    '</div>';
    var tabs = [['list', '表'], ['comments', 'コメント' + (c.commentCount ? '（' + c.commentCount + '）' : '')]];
    var tabHtml = '<div class="tabs">' + tabs.map(function (t) {
      return '<button class="' + (state.terrTab === t[0] ? 'on' : '') + '" data-action="terrTab" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('') + '</div>';
    var warn = (c.comments || []).filter(function (x) { return x.warn; });
    var warnBox = warn.length ? '<div class="warn-box">' + icon('warn', 16) + '<div>' + warn.map(function (x) { return '<div>' + esc(x.body) + '</div>'; }).join('') + '</div></div>' : '';
    return top + warnBox + tabHtml + (state.terrTab === 'comments' ? viewTerrComments(c) : viewTerrList(c));
  }

  // ----- 地図と書き込み -----
  var INK_COLORS = { k: '#222222', r: '#C62828', b: '#1565C0' };
  // history：元に戻すための記録（add＝書いた、del＝消した）
  var ink = { items: [], history: [], tool: 'move', color: 'k', saveTimer: null, status: '' };

  // 地図の表示状態（倍率・表示位置・全画面）は、画面を描き直しても保つ
  var MAP_ZOOMS = [1, 1.5, 2, 3, 4, 6];
  var MAP_MAX_ZOOM = 6;
  var mapView = { cardId: null, zoom: 1, sl: 0, st: 0, full: false };

  function viewTerrMap(c) {
    if (!c.fileId) return c.loading ? '<div class="muted center small">読み込み中…</div>' : '<div class="empty">地図が登録されていません</div>';
    var tool = function (key, ic, label, extra) {
      return '<button type="button" class="tool' + (ink.tool === key ? ' on' : '') + '" data-action="inkTool" data-tool="' + key + '" aria-label="' + label + '" title="' + label + '">' + (extra || icon(ic, 20)) + '</button>';
    };
    var tools = '';
    if (c.canInk) {
      tools = '<div class="map-tools">' +
        tool('move', 'hand', '移動・拡大') +
        tool('pen', 'pen', 'ペン') +
        tool('o', '', '○を置く', '<span class="stamp">○</span>') +
        tool('x', '', '✕を置く', '<span class="stamp">✕</span>') +
        tool('erase', 'eraser', '消しゴム（触れた書き込みを消す）') +
        '<span class="colors">' + ['k', 'r', 'b'].map(function (k) {
          return '<button type="button" class="color' + (ink.color === k ? ' on' : '') + '" style="background:' + INK_COLORS[k] + '" data-action="inkColor" data-color="' + k + '" aria-label="' + ({ k: '黒', r: '赤', b: '青' })[k] + '"></button>';
        }).join('') + '</span>' +
        '<button type="button" class="tool" data-action="inkUndo" aria-label="元に戻す" title="元に戻す">' + icon('undo', 20) + '</button>' +
      '</div>';
    }
    var zoom = '<div class="map-zoom"><button type="button" data-action="mapZoom" data-d="-1" aria-label="縮小">−</button>' +
      '<span id="map-zoom-label">' + Math.round(mapView.zoom * 100) + '%</span>' +
      '<button type="button" data-action="mapZoom" data-d="1" aria-label="拡大">＋</button>' +
      '<button type="button" class="full-btn" data-action="mapFull" aria-label="全画面表示">' + (mapView.full ? '閉じる' : '全画面') + '</button>' +
      '<span class="ink-status muted small" id="ink-status">' + esc(ink.status) + '</span></div>';
    var note = c.canInk
      ? '<div class="muted small">2本指で拡大・縮小・移動できます。ペンなどを選んでいるときは、1本指で書き込みます。書き込みは自動で保存され、次に借りる人に引き継がれます。消しゴムで触れた線や印が消えます' +
        (c.isAdmin ? '（区域カード管理者はすべて消せます）。' : '（消せるのは自分が書いたものだけです）。') + '</div>'
      : '<div class="muted small">2本指で拡大・縮小・移動できます。書き込めるのは、借りている人と区域カード管理者だけです。</div>';
    var clear = c.isAdmin ? '<button class="linkbtn danger-text" data-action="inkClear">書き込みを全消去（区域カード管理者）</button>' : '';
    return '<div class="map-area' + (mapView.full ? ' full' : '') + '" id="map-area">' + tools + zoom +
      '<div class="map-wrap" id="map-wrap"><div class="map-inner" id="map-inner">' +
        '<img id="map-img" alt="区域' + c.number + 'の地図" draggable="false">' +
        '<canvas id="map-ink"></canvas>' +
      '</div></div></div>' + note + clear;
  }

  function mountMap() {
    var c = state.terrCard;
    var img = document.getElementById('map-img');
    if (!c || !img || !c.fileId) return;
    if (mapView.cardId !== c.id) {
      mapView = { cardId: c.id, zoom: 1, sl: 0, st: 0, full: false };
      var area = document.getElementById('map-area');
      if (area) area.classList.remove('full');
    }
    if (ink.cardId !== c.id || (!c.loading && ink.loadedFrom !== c.ink && !ink.dirty)) {
      // カードを開いたとき・最新の書き込みを受け取ったとき
      ink.cardId = c.id;
      ink.loadedFrom = c.ink;
      try { ink.items = c.ink ? (JSON.parse(c.ink).items || []) : []; } catch (e) { ink.items = []; }
      ink.history = [];
      if (!c.canInk) ink.tool = 'move';
    }
    document.body.classList.toggle('map-full-open', mapView.full);
    loadFile(c.fileId).then(function (f) {
      var im = document.getElementById('map-img');
      if (!im) return;
      if (im.src !== f.url) {
        im.onload = function () { applyMapZoom(mapView.zoom); restoreMapScroll(); };
        im.src = f.url;
      } else {
        applyMapZoom(mapView.zoom);
        restoreMapScroll();
      }
    }, function () { img.alt = '地図を読み込めませんでした'; });
    var wrap = document.getElementById('map-wrap');
    if (wrap && !wrap.dataset.bound) {
      wrap.dataset.bound = '1';
      wrap.addEventListener('pointerdown', mapDown);
      wrap.addEventListener('pointermove', mapMove);
      wrap.addEventListener('pointerup', mapUp);
      wrap.addEventListener('pointercancel', mapUp);
      wrap.addEventListener('lostpointercapture', mapUp);
      wrap.addEventListener('scroll', function () {
        mapView.sl = wrap.scrollLeft;
        mapView.st = wrap.scrollTop;
      });
      // パソコンでは Ctrl＋ホイールで拡大・縮小
      wrap.addEventListener('wheel', function (e) {
        if (!e.ctrlKey) return;
        e.preventDefault();
        zoomAt(mapView.zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
      }, { passive: false });
    }
  }

  function restoreMapScroll() {
    var wrap = document.getElementById('map-wrap');
